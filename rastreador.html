<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rastreador</title>
<style>body{font-family:sans-serif;background:#111;color:#0f0;padding:20px;text-align:center}</style>
</head><body>
<h1 id="tit">PALIO1</h1>
<h2 id="status">Toca na tela pra iniciar</h2>
<p id="info">-</p>
<audio id="radio" src="https://streaming.maispu.com.br:10970/stream" preload="none"></audio>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
const sup=createClient("https://wzjhyoyggthasgjygcvo.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6amh5b3lnZ3RoYXNnanlnY3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwNjUxMTMsImV4cCI6MjA3ODY0MTExM30.k1af6Xy2MoFihd3wBOaN2vE-EWWv2ewG2y5Gwu1I5yVw")
const VEICULO=new URLSearchParams(location.search).get("id")||"PALIO1"
document.getElementById('tit').innerText=VEICULO
let lastLat=parseFloat(localStorage.getItem('lastLat_'+VEICULO)||'')
let lastLon=parseFloat(localStorage.getItem('lastLon_'+VEICULO)||'')
let BAT=0, PTS=parseInt(localStorage.getItem('pts_'+VEICULO)||'0')
try{let b=await navigator.getBattery(); BAT=Math.round(b.level*100); b.addEventListener('levelchange',()=>BAT=Math.round(b.level*100))}catch{}
async function enviar(lat,lon,forcado=false){
 if(!lat||!lon) return
 lastLat=lat; lastLon=lon; PTS++
 localStorage.setItem('lastLat_'+VEICULO,lat)
 localStorage.setItem('lastLon_'+VEICULO,lon)
 localStorage.setItem('pts_'+VEICULO,PTS)
 document.getElementById('status').innerText=`${VEICULO} - ${PTS} pts - ONLINE`
 document.getElementById('info').innerText=`${BAT}% | ${lat.toFixed(6)} | ${new Date().toLocaleTimeString()} ${forcado?'(reenviado)':''}`
 await sup.from("posicoes").insert({veiculo_id:VEICULO,lat:lat,lon:lon,bateria:BAT})
}
navigator.geolocation.watchPosition(p=>{ if(p.coords.accuracy>50 && lastLat) return; enviar(p.coords.latitude,p.coords.longitude,false) },null,{enableHighAccuracy:true,maximumAge:0,timeout:15000})
setInterval(()=>{ if(lastLat) enviar(lastLat,lastLon,true) },25000)
const iniciar=async()=>{ try{await document.getElementById('radio').play()}catch{}; if(lastLat) enviar(lastLat,lastLon,true) }
document.body.addEventListener('click',iniciar); document.body.addEventListener('touchstart',iniciar)
if('wakeLock' in navigator){ try{await navigator.wakeLock.request('screen')}catch{} }
</script></body></html>
