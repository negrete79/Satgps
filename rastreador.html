<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker - Visualização</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:system-ui}#map{height:100vh;width:100%}.panel{position:absolute;top:10px;left:10px;z-index:1000;background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.2);max-width:280px}button{padding:8px 12px;border-radius:8px;border:0;background:#111;color:#fff;cursor:pointer;margin:2px}.badge{padding:2px 8px;border-radius:10px;font-size:11px}.ok{background:#00ff88}.err{background:#ff4444;color:#fff}</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h3 style="margin:0 0 8px">🚗 Tracker</h3>
<div>Device: <b id="dev">PALIO2</b> <span id="conn" class="badge err">offline</span></div>
<div style="margin:6px 0">Último: <span id="last">--</span></div>
<div style="margin:6px 0">Pontos: <span id="pts">0</span></div>
<button onclick="loadData()">Atualizar</button>
<button onclick="center()">Centralizar</button>
<button onclick="clearTrail()">Limpar trajeto</button>
<div style="margin-top:8px"><a id="linkR" href="rastreador.html?id=PALIO2" target="_blank">Abrir Rastreador</a></div>
<div style="font-size:10px;color:#666;margin-top:8px" id="info"></div>
</div>
<script>
var CONFIG={SUPABASE_URL:'https://jpaflbkafupwqfqfcjrv.supabase.co',SUPABASE_KEY:'sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf',DEVICE_ID:'PALIO2'};
var map=L.map('map').setView([-20.38,-43.75],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var marker=null;var poly=L.polyline([],{color:'red',weight:4}).addTo(map);var lastLatLng=null;
function logInfo(t){document.getElementById('info').innerText=t;}
async function loadData(){try{var r=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/posicoes?device_id=eq.'+CONFIG.DEVICE_ID+'&order=created_at.desc&limit=100',{headers:{'apikey':CONFIG.SUPABASE_KEY,'Authorization':'Bearer '+CONFIG.SUPABASE_KEY}});if(!r.ok){logInfo('Erro '+r.status+' '+(await r.text()).slice(0,100));return;}var data=await r.json();if(!data.length){logInfo('Sem dados ainda. Inicie o rastreador.');document.getElementById('conn').textContent='sem dados';return;}document.getElementById('pts').textContent=data.length;document.getElementById('last').textContent=new Date(data[0].created_at).toLocaleTimeString('pt-BR');document.getElementById('conn').textContent='online';document.getElementById('conn').className='badge ok';var latlngs=data.map(d=>[d.lat,d.lng]).reverse();poly.setLatLngs(latlngs);lastLatLng=[data[0].lat,data[0].lng];if(!marker) marker=L.marker(lastLatLng).addTo(map).bindPopup('PALIO2');else marker.setLatLng(lastLatLng);logInfo('OK');}catch(e){logInfo('Failed to fetch '+e.message);document.getElementById('conn').textContent='erro fetch';}}
function center(){if(lastLatLng) map.setView(lastLatLng,17);}function clearTrail(){poly.setLatLngs([]);}
loadData();setInterval(loadData,5000);
</script>
</body>
</html>
