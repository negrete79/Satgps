<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SatGPS</title><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;overflow:hidden;height:100vh}#map{position:absolute;inset:0;background:#111}
.top{position:absolute;top:12px;left:12px;right:12px;z-index:1000;display:flex;justify-content:space-between}
.gbtn{background:rgba(20,20,20,0.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px 16px;border-radius:100px;font-weight:700;font-size:13px}
#loading{position:absolute;inset:0;z-index:900;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column}
#sheet{position:absolute;bottom:0;left:0;right:0;z-index:1001;background:rgba(20,24,32,0.85);backdrop-filter:blur(20px);border-radius:28px 28px 0 0;padding:20px}
</style></head><body>
<div id="map"></div>
<div class="top"><button class="gbtn" onclick="location.href='./'">← Voltar</button><div style="display:flex;gap:8px"><button class="gbtn" onclick="setTipo('rua')">Rua</button><button class="gbtn" onclick="setTipo('sat')">Satélite</button></div></div>
<div id="loading"><div style="width:40px;height:40px;border:4px solid #222;border-top-color:#a6ff00;border-radius:50%;animation:spin 1s linear infinite"></div><div style="margin-top:14px;font-weight:700">Carregando...</div><div id="msg" style="opacity:0.5;margin-top:6px;font-size:12px"></div></div>
<div id="sheet" style="display:none"></div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co";const K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const ID=(new URLSearchParams(location.search).get('id')||'PALIO2').toUpperCase();
let map,rL,sL,sLb,marker;
function init(lat,lng){if(map){map.setView([lat,lng],17);return}map=L.map('map',{zoomControl:false}).setView([lat,lng],17);rL=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);sL=L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}');sLb=L.tileLayer('https://mt1.google.com/vt/lyrs=h&x={x}&y={y}&z={z}');}
function setTipo(t){if(!map)return;if(t==='sat'){map.removeLayer(rL);sL.addTo(map);sLb.addTo(map)}else{map.removeLayer(sL);map.removeLayer(sLb);rL.addTo(map)}}
async function load(){
 try{
  let res=await fetch(`${U}/rest/v1/rastreador?device_id=ilike.${ID}&limit=1`,{headers:{apikey:K,Authorization:`Bearer ${K}`}});
  let j=await res.json();
  if(!j.length){msg.textContent=`ID ${ID} não encontrado`;return}
  let d=j[0];
  if(!d.lat||!d.lng){msg.textContent=`${ID} sem lat/lng`;return}
  document.getElementById('loading').style.display='none';
  document.getElementById('sheet').style.display='block';
  init(+d.lat,+d.lng);
  let pos=[+d.lat,+d.lng];
  if(!marker)marker=L.marker(pos).addTo(map);else marker.setLatLng(pos);
  let bat=d.battery??0;let online=Date.now()-new Date(d.updated_at).getTime()<120000;
  sheet.innerHTML=`<div style="display:flex;justify-content:space-between"><div><div style="font-size:20px;font-weight:800">${d.device_id}</div><div style="font-size:11px;opacity:0.5">ID: ${d.device_id} • ${new Date(d.updated_at).toLocaleString('pt-BR')}</div><div style="font-size:11px;color:${online?'#a6ff00':'#ff5a5a'}">${online?'● Online':'● Offline'} • há ${Math.round((Date.now()-new Date(d.updated_at).getTime())/1000)}s</div></div><div style="font-size:30px;font-weight:900;color:#a6ff00">${bat}%</div></div><div style="height:4px;background:#222;border-radius:10px;margin:14px 0"><div style="height:100%;width:${bat}%;background:#a6ff00;border-radius:10px"></div></div><div style="display:flex;gap:10px"><button class="gbtn" style="flex:1" onclick="map.flyTo([${d.lat},${d.lng}],18)">🎯 Focar</button><button class="gbtn" style="flex:1;background:#fff;color:#000" onclick="window.open('https://www.google.com/maps?q=${d.lat},${d.lng}','_blank')">📍 Google Maps</button></div>`;
 }catch(e){msg.textContent='Erro: '+e.message}
}
load();setInterval(load,6000);
</script></body></html>
