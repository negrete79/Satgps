<title>SatGPS - Rastreamento</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0a;
    --glass:rgba(20,20,20,0.45);
    --border:rgba(255,255,255,0.15);
    --primary:#a6ff00;
    --text:#fff;
    --text-dim:rgba(255,255,255,0.6);
    --text-faint:rgba(255,255,255,0.4);
    --danger:#ff4444;
    --r:24px;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #map{position:fixed;inset:0;z-index:1}

  /* ===== TOP BAR ===== */
  .topbar{
    position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:999;
    display:flex;justify-content:space-between;align-items:center;gap:10px
  }
  .glass-btn{
    background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
    border:1px solid var(--border);border-radius:18px;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:13px;font-weight:600;font-family:inherit;transition:all .2s
  }
  .glass-btn:hover{background:rgba(20,20,20,0.65);border-color:rgba(255,255,255,0.25)}
  .glass-btn svg{width:18px;height:18px}
  .back-btn{padding:11px 16px}
  .layer-toggle{display:flex;padding:4px;gap:2px}
  .layer-toggle button{
    background:transparent;border:none;color:var(--text-dim);padding:8px 12px;border-radius:14px;
    cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .2s
  }
  .layer-toggle button.active{background:rgba(255,255,255,0.15);color:#fff}

  /* ===== FLOATING CAR BUTTON ===== */
  #carBtn{
    position:fixed;left:50%;bottom:280px;transform:translateX(-50%) translateY(20px);z-index:998;
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,0.18);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
    border:1px solid rgba(255,255,255,0.22);color:#fff;cursor:pointer;
    display:none;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.4,0,.2,1)
  }
  #carBtn.show{display:flex;transform:translateX(-50%) translateY(0)}
  #carBtn:active{transform:translateX(-50%) scale(0.92)}
  #carBtn svg{width:22px;height:22px;fill:var(--primary)}

  /* ===== EMPTY STATE (sem localização) ===== */
  #emptyState{
    position:fixed;inset:0;z-index:998;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,10,10,0.95);backdrop-filter:blur(20px);padding:24px;text-align:center
  }
  #emptyState .icon{
    width:80px;height:80px;border-radius:50%;background:rgba(166,255,0,0.1);
    display:flex;align-items:center;justify-content:center;margin-bottom:24px
  }
  #emptyState .icon svg{width:40px;height:40px;fill:var(--primary)}
  #emptyState h2{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-0.3px}
  #emptyState p{color:var(--text-dim);font-size:14px;max-width:320px;line-height:1.5;margin-bottom:30px}
  #emptyState .btn-create{
    background:var(--primary);color:#0a0a0a;border:none;padding:15px 30px;border-radius:16px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:0.3px;transition:all .2s
  }
  #emptyState .btn-create:hover{background:#b8ff33;transform:translateY(-1px)}
  #emptyState .btn-create:disabled{opacity:0.5;cursor:wait;transform:none}
  #emptyState .id-chip{
    display:inline-block;padding:6px 14px;background:rgba(255,255,255,0.08);border:1px solid var(--border);
    border-radius:20px;font-size:12px;font-family:ui-monospace,monospace;color:var(--text-dim);margin-bottom:24px
  }

  /* ===== BOTTOM SHEET ===== */
  #sheet{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:999;
    width:100%;max-width:520px;
    background:rgba(15,15,15,0.92);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
    border-top:1px solid var(--border);border-radius:28px 28px 0 0;
    transition:transform .35s cubic-bezier(.32,.72,0,1);
    padding-bottom:env(safe-area-inset-bottom);
    touch-action:none
  }
  #sheet.collapsed{transform:translateX(-50%) translateY(calc(100% - 60px))}
  #sheet .handle{
    width:44px;height:5px;background:rgba(255,255,255,0.3);border-radius:3px;margin:10px auto 6px;cursor:pointer
  }
  #sheet .handle-wrap{display:flex;justify-content:center;padding:4px 0}
  #sheet .sheet-content{padding:8px 22px 22px}
  #sheet .vname{font-size:22px;font-weight:700;letter-spacing:-0.4px;margin-bottom:2px}
  #sheet .vid{font-size:11px;color:var(--text-faint);font-family:ui-monospace,monospace;margin-bottom:16px;letter-spacing:0.5px}
  
  .battery-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .battery-big{font-size:28px;font-weight:700;letter-spacing:-0.5px;line-height:1}
  .battery-big.high{color:var(--primary)}
  .battery-big.mid{color:#ffaa00}
  .battery-big.low{color:var(--danger)}
  .battery-bar{flex:1;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
  .battery-bar-fill{height:100%;border-radius:4px;transition:all .4s}
  .battery-bar-fill.high{background:var(--primary)}
  .battery-bar-fill.mid{background:#ffaa00}
  .battery-bar-fill.low{background:var(--danger)}

  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .meta-cell{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:12px}
  .meta-cell .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-bottom:4px}
  .meta-cell .val{font-size:14px;font-weight:600}

  .sheet-actions{display:flex;gap:10px}
  .sheet-btn{
    flex:1;padding:13px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:14px;
    color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s
  }
  .sheet-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}
  .sheet-btn.primary{background:rgba(166,255,0,0.15);border-color:rgba(166,255,0,0.3);color:var(--primary)}
  .sheet-btn svg{width:16px;height:16px}

  /* ===== LEAFLET ===== */
  .leaflet-control-zoom{display:none!important}
  .leaflet-control-attribution{
    background:rgba(15,15,15,0.7)!important;color:rgba(255,255,255,0.5)!important;
    backdrop-filter:blur(10px);font-size:9px;border-radius:8px!important;padding:4px 8px!important
  }
  .leaflet-control-attribution a{color:rgba(255,255,255,0.7)!important}

  /* ===== LOADING ===== */
  #loading{
    position:fixed;inset:0;background:rgba(10,10,10,0.95);z-index:9999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px
  }
  .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== CAR MARKER ===== */
  .car-marker{position:relative;width:40px;height:40px}
  .car-marker .pulse{
    position:absolute;inset:0;border-radius:50%;background:rgba(166,255,0,0.3);
    animation:carPulse 2s ease-out infinite
  }
  @keyframes carPulse{0%{transform:scale(0.6);opacity:0.8}100%{transform:scale(1.8);opacity:0}}
  .car-marker svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6))}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p style="color:var(--text-dim);font-size:13px">Carregando...</p></div>

<div id="map"></div>

<div class="topbar">
  <button class="glass-btn back-btn" onclick="goBack()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <div class="glass-btn layer-toggle">
    <button id="btnRua" onclick="setLayer('rua')">Rua</button>
    <button id="btnSat" class="active" onclick="setLayer('sat')">Satélite</button>
  </div>
</div>

<button id="carBtn" onclick="focusCar()" title="Voltar ao carro">
  <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
</button>

<div id="emptyState" class="hidden">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
  </div>
  <div class="id-chip" id="emptyId">ID: --</div>
  <h2>Veículo sem localização</h2>
  <p>Este veículo ainda não enviou a primeira localização. Clique abaixo para criar uma posição inicial e o rastreamento começar.</p>
  <button class="btn-create" id="btnCreate" onclick="createInitialLocation()">
    <span id="btnCreateText">Criar localização inicial</span>
  </button>
</div>

<div id="sheet" class="collapsed">
  <div class="handle-wrap"><div class="handle" onclick="toggleSheet()"></div></div>
  <div class="sheet-content">
    <div class="vname" id="sName">--</div>
    <div class="vid" id="sId">--</div>
    <div class="battery-row">
      <div class="battery-big" id="sBat">--%</div>
      <div class="battery-bar"><div class="battery-bar-fill" id="sBatFill"></div></div>
    </div>
    <div class="meta-grid">
      <div class="meta-cell">
        <div class="lbl">Última atualização</div>
        <div class="val" id="sTime">--</div>
      </div>
      <div class="meta-cell">
        <div class="lbl">Status</div>
        <div class="val" id="sStatus">--</div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn primary" onclick="focusCar()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        Focar
      </button>
      <button class="sheet-btn" onclick="openGoogleMaps()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
        Google Maps
      </button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SatGPS - Rastreador individual (link público)
   ============================================================ */

const U = "https://jpaflbkafupwqfqfcjrv.supabase.co";
const K = "sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const H = { apikey: K, Authorization: "Bearer " + K };
const DEFAULT_LAT = -24.120;
const DEFAULT_LNG = -48.345;
const ONLINE_MS = 2 * 60 * 1000;
const REFRESH_MS = 6000;

// Pega ID da URL
const params = new URLSearchParams(location.search);
const DEVICE_ID = params.get('id');

let currentLayer = 'sat';
let ruaLayer, satLayer, lblLayer;
let marker = null;
let firstLoad = true;
let sheetCollapsed = true;
let followingCar = true;
let lastData = null;

/* ===== MAPA ===== */
const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([DEFAULT_LAT, DEFAULT_LNG], 13);

// Layers
ruaLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' });
satLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom:20, attribution:'© Google' }).addTo(map);
lblLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=h&x={x}&y={y}&z={z}', { maxZoom:20, pane:'shadowPane' }).addTo(map);
// labels pane acima das tiles normais
map.createPane('labels');
map.getPane('labels').style.zIndex = 450;
map.getPane('labels').style.pointerEvents = 'none';
lblLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=h&x={x}&y={y}&z={z}', { maxZoom:20, pane:'labels', attribution:'© Google' }).addTo(map);

function setLayer(layer) {
  if (layer === currentLayer) return;
  currentLayer = layer;
  if (layer === 'rua') {
    map.removeLayer(satLayer); map.removeLayer(lblLayer);
    ruaLayer.addTo(map);
    document.getElementById('btnRua').classList.add('active');
    document.getElementById('btnSat').classList.remove('active');
  } else {
    map.removeLayer(ruaLayer);
    satLayer.addTo(map); lblLayer.addTo(map);
    document.getElementById('btnSat').classList.add('active');
    document.getElementById('btnRua').classList.remove('active');
  }
}

/* ===== CAR MARKER ===== */
const CAR_SVG = `<svg viewBox="0 0 32 44" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6ff00"/>
      <stop offset="1" stop-color="#7acc00"/>
    </linearGradient>
  </defs>
  <path d="M8 2 L24 2 Q28 2 28 6 L28 16 Q29 17 29 19 L29 25 Q29 27 28 28 L28 38 Q28 42 24 42 L8 42 Q4 42 4 38 L4 28 Q3 27 3 25 L3 19 Q3 17 4 16 L4 6 Q4 2 8 2 Z" fill="url(#carGrad)" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="7" y="9" width="18" height="7" rx="1.5" fill="#0a0a0a" opacity="0.7"/>
  <rect x="7" y="28" width="18" height="7" rx="1.5" fill="#0a0a0a" opacity="0.7"/>
</svg>`;

const carIcon = L.divIcon({
  className: '',
  html: `<div class="car-marker"><div class="pulse"></div>${CAR_SVG}</div>`,
  iconSize: [40, 40],
  iconAnchor: [20, 20]
});

/* ===== HELPERS ===== */
function isOnline(updated_at) {
  if (!updated_at) return false;
  return (Date.now() - new Date(updated_at).getTime()) < ONLINE_MS;
}
function timeAgo(updated_at) {
  if (!updated_at) return 'nunca';
  const s = Math.floor((Date.now() - new Date(updated_at).getTime()) / 1000);
  if (s < 0) return 'agora';
  if (s < 60) return `há ${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `há ${m}min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h}h`;
  return `há ${Math.floor(h / 24)}d`;
}
function formatTime(updated_at) {
  if (!updated_at) return '--';
  return new Date(updated_at).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

/* ===== INIT ===== */
if (!DEVICE_ID) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('emptyState').classList.remove('hidden');
  document.querySelector('#emptyState h2').innerText = 'ID não informado';
  document.querySelector('#emptyState p').innerText = 'Adicione ?id=SEU_ID na URL. Exemplo: rastreador.html?id=PALIO1';
  document.getElementById('btnCreate').style.display = 'none';
} else {
  document.getElementById('emptyId').innerText = 'ID: ' + DEVICE_ID;
  initMap();
}

async function initMap() {
  await refresh();
  document.getElementById('loading').classList.add('hidden');
  setInterval(refresh, REFRESH_MS);
  setInterval(updateSheet, 10000); // atualiza "há X min" sozinho
}

/* ===== REFRESH ===== */
async function refresh() {
  if (!DEVICE_ID) return;
  try {
    const r = await fetch(`${U}/rest/v1/rastreador?device_id=eq.${encodeURIComponent(DEVICE_ID)}&limit=1`, { headers: H, cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d[0]) {
      // Sem localização - mostra empty state
      document.getElementById('emptyState').classList.remove('hidden');
      document.getElementById('sheet').style.display = 'none';
      return;
    }
    // Tem localização - esconde empty state, mostra mapa
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('sheet').style.display = 'block';

    lastData = d[0];
    const latlng = [d[0].lat, d[0].lng];

    if (!marker) {
      marker = L.marker(latlng, { icon: carIcon }).addTo(map);
      map.setView(latlng, 17, { animate: false });
      firstLoad = false;
      // Abre sheet automaticamente
      setTimeout(() => {
        document.getElementById('sheet').classList.remove('collapsed');
        sheetCollapsed = false;
      }, 800);
    } else {
      marker.setLatLng(latlng);
      if (followingCar) {
        map.panTo(latlng, { animate: true, duration: 1 });
      }
    }
    updateSheet();
  } catch (e) {
    console.error(e);
  }
}

function updateSheet() {
  if (!lastData) return;
  const v = lastData;
  const online = isOnline(v.updated_at);
  const bat = v.battery || 0;
  const batClass = bat > 50 ? 'high' : bat > 20 ? 'mid' : 'low';

  document.getElementById('sName').innerText = v.device_id;
  document.getElementById('sId').innerText = 'ID: ' + v.device_id;
  document.getElementById('sBat').innerText = bat + '%';
  document.getElementById('sBat').className = 'battery-big ' + batClass;
  document.getElementById('sBatFill').style.width = Math.min(bat, 100) + '%';
  document.getElementById('sBatFill').className = 'battery-bar-fill ' + batClass;
  document.getElementById('sTime').innerText = timeAgo(v.updated_at);
  document.getElementById('sStatus').innerText = online ? 'Online' : 'Offline';
}

/* ===== UI INTERACTIONS ===== */
function toggleSheet() {
  sheetCollapsed = !sheetCollapsed;
  document.getElementById('sheet').classList.toggle('collapsed', sheetCollapsed);
}

// Drag bottom sheet
let dragStartY = null, dragStartTop = null;
const sheet = document.getElementById('sheet');
const handle = sheet.querySelector('.handle');

sheet.addEventListener('touchstart', e => {
  if (e.target !== handle && !e.target.classList.contains('handle-wrap')) return;
  dragStartY = e.touches[0].clientY;
  dragStartTop = sheet.getBoundingClientRect().top;
  sheet.style.transition = 'none';
}, { passive: true });

sheet.addEventListener('touchmove', e => {
  if (dragStartY === null) return;
  const delta = e.touches[0].clientY - dragStartY;
  const newTop = Math.max(window.innerHeight - 380, Math.min(window.innerHeight - 60, dragStartTop + delta));
  const offset = window.innerHeight - newTop - sheet.offsetHeight;
  sheet.style.transform = `translateX(-50%) translateY(${window.innerHeight - newTop - sheet.offsetHeight}px)`;
  sheet.classList.add('collapsed');
}, { passive: true });

sheet.addEventListener('touchend', e => {
  if (dragStartY === null) return;
  const endY = e.changedTouches[0].clientY;
  const delta = endY - dragStartY;
  sheet.style.transition = '';
  sheet.style.transform = '';
  if (delta < -40) { sheet.classList.remove('collapsed'); sheetCollapsed = false; }
  else if (delta > 40) { sheet.classList.add('collapsed'); sheetCollapsed = true; }
  dragStartY = null;
}, { passive: true });

// Map drag → mostra botão de voltar
map.on('dragstart', () => { followingCar = false; document.getElementById('carBtn').classList.add('show'); });

function focusCar() {
  if (!marker) return;
  const latlng = marker.getLatLng();
  map.flyTo(latlng, 17, { duration: 1.5 });
  followingCar = true;
  setTimeout(() => document.getElementById('carBtn').classList.remove('show'), 1600);
}

function openGoogleMaps() {
  if (!lastData) return;
  window.open(`https://www.google.com/maps?q=${lastData.lat},${lastData.lng}`, '_blank');
}

function goBack() {
  history.length > 1 ? history.back() : window.close();
}

/* ===== CRIAR LOCALIZAÇÃO INICIAL ===== */
async function createInitialLocation() {
  const btn = document.getElementById('btnCreate');
  const txt = document.getElementById('btnCreateText');
  btn.disabled = true;
  txt.innerText = 'Criando...';
  try {
    const r = await fetch(`${U}/rest/v1/rastreador`, {
      method: 'POST',
      headers: { ...H, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({
        device_id: DEVICE_ID,
        lat: DEFAULT_LAT,
        lng: DEFAULT_LNG,
        battery: 0,
        updated_at: new Date().toISOString()
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 || r.status === 403 ? ' - RLS bloqueando. Veja instruções.' : ''));
    // Recarrega
    location.reload();
  } catch (e) {
    btn.disabled = false;
    txt.innerText = 'Tentar novamente';
    alert('Erro: ' + e.message);
  }
}

/* ===== SERVICE WORKER ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});
}
