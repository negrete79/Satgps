<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rastreador</title></head><body style="background:#000;color:#fff;font-family:system-ui;padding:20px;text-align:center">
<h2 id="id">PALIO1</h2><div id="status">Aguardando GPS...</div><button id="btn" style="padding:20px;background:#b6ff00;border:0;border-radius:15px;font-weight:900;width:100%;margin-top:20px" onclick="iniciar()">INICIAR RASTREAMENTO</button>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let ID=new URLSearchParams(location.search).get('id')||'PALIO1'; ID=ID.toUpperCase(); document.getElementById('id').innerText=ID;
let watch=null;
async function enviar(lat,lng,bat){
  let body={device_id:ID,lat:lat,lng:lng,battery:bat||100,updated_at:new Date().toISOString()};
  await fetch(`${U}/rest/v1/rastreador`,{method:'POST',headers:{apikey:K,Authorization:"Bearer "+K,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(body)});
  await fetch(`${U}/rest/v1/rastreador_historico`,{method:'POST',headers:{apikey:K,Authorization:"Bearer "+K,'Content-Type':'application/json'},body:JSON.stringify({device_id:ID,lat:lat,lng:lng,created_at:new Date().toISOString()})});
  document.getElementById('status').innerText=`Enviando: ${lat.toFixed(5)}, ${lng.toFixed(5)} - ${new Date().toLocaleTimeString()}`;
}
async function iniciar(){
  document.getElementById('btn').style.display='none';
  let bat=100; try{ let b=await navigator.getBattery(); bat=Math.round(b.level*100); }catch{}
  watch=navigator.geolocation.watchPosition(p=>{ enviar(p.coords.latitude,p.coords.longitude,bat); },{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}
</script></body></html>
