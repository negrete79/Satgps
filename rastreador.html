<script>
// ... mesma parte de cima ...
  const enviar=async(lat,lon,forcar=false)=>{
    if(!forcar && Date.now()-ultimo<25000)return; // 25s
    ultimo=Date.now();clima(lat,lon);
    document.getElementById('temp').innerText=`${DEVICE_ID} ${BAT}% | ${new Date().toLocaleTimeString('pt-BR')} | RÁDIO ON | ${lat.toFixed(5)}`;
    await fetch(`${U}/rest/v1/rastreador`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({device_id:DEVICE_ID,lat:lat,lng:lon,battery:BAT,updated_at:new Date().toISOString()})});
    await fetch(`${U}/rest/v1/rastreador_historico`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({device_id:DEVICE_ID,lat:lat,lng:lon,battery:BAT})}).catch(()=>{});
  };
  const pega = () => navigator.geolocation.getCurrentPosition(p=>enviar(p.coords.latitude,p.coords.longitude,true),null,{enableHighAccuracy:true});
  pega();
  navigator.geolocation.watchPosition(p=>enviar(p.coords.latitude,p.coords.longitude,false),null,{enableHighAccuracy:true,maximumAge:0});
  setInterval(pega, 25000); // manda mesmo parado a cada 25s
</script>
