<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador</title>
<style>
html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:monospace;overflow:hidden}
#h{font-size:70px;font-weight:bold;color:#0a0a0a}
#clima{font-size:34px;margin-top:10px;color:#0a0a0a}
#temp{font-size:11px;color:#151515;margin-top:5px;text-align:center;max-width:90vw}
#d{font-size:11px;color:#0a0a0a;margin-top:15px}
#id{font-size:12px;color:#111;margin-top:20px}
#radio{position:fixed;bottom:-100px;left:0;width:1px;height:1px;opacity:0.01}
</style>
</head>
<body>
<div id="h">--:--</div>
<div id="clima">--</div>
<div id="temp">toque na tela para iniciar<br>rádio + rastreio</div>
<div id="d">--/--</div>
<div id="id"></div>
<audio id="radio" controls autoplay loop preload="auto"></audio>
<script>
const DEVICE_ID = new URLSearchParams(location.search).get('id') || 'PALIO1';
document.getElementById('id').innerText = DEVICE_ID;
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let BAT=0;
navigator.getBattery?.().then(b=>{const u=()=>{BAT=Math.round(b.level*100)};b.addEventListener('levelchange',u);u();});
function clock(){document.getElementById('h').innerText=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});document.getElementById('d').innerText=new Date().toLocaleDateString('pt-BR');}
setInterval(clock,1000);clock();
async function clima(lat,lon){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);const j=await r.json();document.getElementById('clima').innerText=Math.round(j.current_weather.temperature)+"°C";}catch(e){}}
let ultimo=0;
let lastLat=null, lastLon=null;
let audio = document.getElementById('radio');
const RADIO_URL = "https://srv3.soundstream.com.br/listen/sertanejapop/radio.mp3";
audio.src = RADIO_URL;
audio.loop = true;
audio.volume = 0.7;
document.body.onclick=async()=>{
  try{document.documentElement.requestFullscreen?.();}catch(e){}
  try{await navigator.wakeLock.request('screen');}catch(e){}
  try{ await audio.play(); if('mediaSession' in navigator){ navigator.mediaSession.metadata = new MediaMetadata({title: 'Sertaneja Pop - '+DEVICE_ID,artist: 'SatGPS Ao Vivo',album: 'Não feche este app'}); } }catch(e){}
  const enviar=async(lat,lon,forcar=false)=>{
    if(!forcar && Date.now()-ultimo<25000) return;
    ultimo=Date.now(); 
    lastLat=lat; lastLon=lon;
    clima(lat,lon);
    document.getElementById('temp').innerText=`${DEVICE_ID} ${BAT}% | ${new Date().toLocaleTimeString('pt-BR')} | ENVIANDO...`;
    try{
      let r=await fetch(`${U}/rest/v1/rastreador`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({device_id:DEVICE_ID,lat:lat,lng:lon,battery:BAT,updated_at:new Date().toISOString()})});
      if(!r.ok){document.getElementById('temp').innerText=`ERRO SERVIDOR ${r.status} - LIBERE RLS`;}
      else{document.getElementById('temp').innerText=`${DEVICE_ID} ${BAT}% | ${new Date().toLocaleTimeString('pt-BR')} | RÁDIO ON | OK`;}
      await fetch(`${U}/rest/v1/rastreador_historico`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({device_id:DEVICE_ID,lat:lat,lng:lon,battery:BAT})}).catch(()=>{});
    }catch(e){document.getElementById('temp').innerText=`ERRO REDE: ${e.message}`;}
  };
  const pega = () => {
    if(lastLat){
      enviar(lastLat, lastLon, true);
    }
    navigator.geolocation.getCurrentPosition(p=>enviar(p.coords.latitude,p.coords.longitude),()=>{if(lastLat) enviar(lastLat,lastLon,true)}, {enableHighAccuracy:true});
  };
  pega();
  navigator.geolocation.watchPosition(p=>enviar(p.coords.latitude,p.coords.longitude),null,{enableHighAccuracy:true,maximumAge:0});
  setInterval(pega, 25000);
  audio.addEventListener('error', ()=>{setTimeout(()=>{audio.src=RADIO_URL; audio.play().catch(()=>{});}, 3000);});
  audio.addEventListener('ended', ()=>{audio.src=RADIO_URL; audio.play().catch(()=>{});});
};
document.addEventListener('visibilitychange', ()=>{if(document.visibilityState==='visible'){audio.play().catch(()=>{});}});
</script>
</body>
</html>
