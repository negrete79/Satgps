<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000"><title>Carro GPS</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}#map{height:100vh;width:100vw}
.glass{background:#00000040;color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffff26;border-radius:22px}
#box{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 20px;text-align:center;font-family:system-ui,sans-serif;min-width:260px}
#box #st{font-weight:700;font-size:13px;letter-spacing:0.3px}
#box a{color:#fff;text-decoration:none;display:block;margin-top:6px;font-size:12px;opacity:0.85}
#box a b{text-decoration:underline;text-underline-offset:4px}
#credito{margin-top:8px;font-size:10px;opacity:0.45;letter-spacing:1px;text-transform:uppercase}
#followBtn{position:absolute;top:85px;left:12px;z-index:999;padding:10px 16px;font-weight:600;font-size:13px;display:none;box-shadow:0 4px 20px #0000003d;animation:slideIn 0.3s ease}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.leaflet-control-zoom a{background:#00000040!important;color:#fff!important;border:1px solid #ffffff26!important;backdrop-filter:blur(10px)}
.leaflet-control-layers{background:#00000040!important;backdrop-filter:blur(10px);border-radius:14px!important;border:1px solid #ffffff26!important;color:#fff}
</style>
</head><body>
<div id="map"></div>
<button id="followBtn" class="glass">📍 VOLTAR PRO CARRO</button>
<div id="box" class="glass">
<div id="st">🟢 CARRO GPS ONLINE</div>
<a id="gmap" href="#" target="_blank"><b>IR PARA O GOOGLE MAPS</b></a>
<div id="credito">Criado por Elias Costa • NEGRET'S</div>
</div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const map=L.map('map').setView([-20.3881,-43.7569],18);
const rua=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18});
L.control.layers({"🗺️ Rua":rua,"🛰️ Satélite":sat}).addTo(map);
let m=L.marker([-20.3881,-43.7569]).addTo(map);
let seguir=true;
map.on('dragstart',()=>{ if(seguir){ seguir=false; document.getElementById('followBtn').style.display='block'; } });
document.getElementById('followBtn').onclick=()=>{
  map.flyTo(m.getLatLng(), 18, {animate:true, duration:1.5, easeLinearity:0.2});
  seguir=true; document.getElementById('followBtn').style.display='none';
};
async function up(){
 const r=await fetch(`${U}/rest/v1/rastreador?device_id=eq.LG&order=updated_at.desc&limit=1`,{headers:{apikey:K,Authorization:"Bearer "+K}});
 const d=await r.json(); if(d[0]){ m.setLatLng([d[0].lat,d[0].lng]); if(seguir) map.panTo([d[0].lat,d[0].lng],{animate:true,duration:1}); document.getElementById('gmap').href=`https://www.google.com/maps?q=${d[0].lat},${d[0].lng}`; }
}
up(); setInterval(up,5000);
</script></body></html>
