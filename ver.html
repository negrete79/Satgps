<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body{margin:0;height:100%} #map{height:100vh;width:100vw}</style>
</head>
<body>
<div id="map"></div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const map=L.map('map').setView([-20.3881,-43.7569],18);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
let m=L.marker([-20.3881,-43.7569]).addTo(map);
async function up(){
  const r=await fetch(`${U}/rest/v1/rastreador?device_id=eq.LG&order=updated_at.desc&limit=1`,{headers:{apikey:K,Authorization:"Bearer "+K}});
  const d=await r.json(); if(d[0]){ m.setLatLng([d[0].lat,d[0].lng]); map.setView([d[0].lat,d[0].lng],18); }
}
up(); setInterval(up,3000);
</script>
</body>
</html>
