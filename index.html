<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALIO2 - Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#0f0f0f}#map{height:100vh;width:100vw}
.panel{position:absolute;top:12px;left:12px;z-index:1000;background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);width:300px;max-width:calc(100vw - 24px)}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid #eee}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800} .ok{background:#00ff88;color:#000} .err{background:#ff3b30;color:#fff}
.btns{display:flex;gap:6px;margin-top:10px} .btns button{flex:1;padding:8px;border-radius:10px;border:0;background:#111;color:#fff;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h3>🚗 <span id="dev">PALIO2</span> <span id="conn" class="badge err">offline</span></h3>
<div class="row"><span>Último</span><b id="last">--</b></div>
<div class="row"><span>Pontos</span><b id="pts">0</b></div>
<div class="row"><span>Lat,Lng</span><b id="ll">--</b></div>
<div class="btns"><button onclick="loadData()">Atualizar</button><button onclick="center()">Centralizar</button><button onclick="clearTrail()">Limpar</button></div>
<div style="margin-top:10px"><a id="linkR" href="rastreador.html?id=PALIO2" target="_blank">📱 Abrir Rastreador</a> - <a href="#" onclick="toggleRealtime();return false" id="rt">Realtime: ON</a></div>
<div id="info" style="font-size:10px;color:#888;margin-top:8px"></div>
</div>
<script>
const CFG={URL:'https://jpaflbkafupwqfqfcjrv.supabase.co',KEY:'sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf',ID:new URLSearchParams(location.search).get('id')||'PALIO2'};
const map=L.map('map').setView([-23.5,-46.6],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker=null,poly=L.polyline([],{color:'#ff3b30',weight:4}).addTo(map),lastLatLng=null,supabaseClient=null,channel=null,realtimeOn=true;
function info(t){document.getElementById('info').textContent=t;}
function setConn(c,cls){const e=document.getElementById('conn');e.textContent=c;e.className='badge '+cls;}
async function loadData(){
  const url=CFG.URL+'/rest/v1/posicoes?device_id=eq.'+encodeURIComponent(CFG.ID)+'&order=created_at.desc&limit=100';
  const r=await fetch(url,{headers:{'apikey':CFG.KEY,'Authorization':'Bearer '+CFG.KEY}});
  if(!r.ok){info('Erro '+r.status);return;}
  const data=await r.json(); if(!data.length){info('Sem dados. Inicie rastreador');setConn('sem dados','warn');return;}
  document.getElementById('pts').textContent=data.length;document.getElementById('last').textContent=new Date(data[0].created_at).toLocaleTimeString('pt-BR');document.getElementById('ll').textContent=data[0].lat.toFixed(5)+','+data[0].lng.toFixed(5);
  poly.setLatLngs(data.map(d=>[d.lat,d.lng]).reverse());lastLatLng=[data[0].lat,data[0].lng];
  if(!marker){marker=L.marker(lastLatLng).addTo(map);map.setView(lastLatLng,16);}else marker.setLatLng(lastLatLng);setConn('online','ok');info('OK '+data.length+' pts');
}
function center(){if(lastLatLng)map.setView(lastLatLng,17);}function clearTrail(){poly.setLatLngs([]);}
function setupRealtime(){supabaseClient=supabase.createClient(CFG.URL,CFG.KEY);channel=supabaseClient.channel('posicoes-'+CFG.ID).on('postgres_changes',{event:'INSERT',schema:'public',table:'posicoes',filter:'device_id=eq.'+CFG.ID},(p)=>{const n=p.new;const ll=[n.lat,n.lng];lastLatLng=ll;const cur=poly.getLatLngs();cur.push(ll);poly.setLatLngs(cur);if(marker)marker.setLatLng(ll);}).subscribe();}
loadData();setupRealtime();setInterval(()=>{if(!realtimeOn)loadData();},5000);
</script>
</body>
</html>
