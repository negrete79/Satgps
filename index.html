<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SatGPS</title><style>body{background:#000;color:#fff;font-family:system-ui;padding:14px}h1 span{color:#7FFF00}.card{background:#151515;border:1px solid #222;border-radius:18px;padding:14px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800} .green{background:#7FFF00;color:#000;width:100%;padding:16px;font-size:16px} .row{display:flex;gap:8px;margin-top:10px} .row button{flex:1;background:#222;color:#fff}</style></head><body>
<h1>Sat<span>GPS</span> <small id="qtd" style="opacity:.5;font-size:14px"></small></h1>
<button class="green" onclick="add()">+ Adicionar Veículo</button>
<div id="lista"></div>
<script>
function getAll(){return JSON.parse(localStorage.getItem('veiculos')||'[{"id":"PALIO2","nome":"Palio2","bat":87},{"id":"PALIO1","nome":"Maria","bat":90}]')}
function saveAll(v){localStorage.setItem('veiculos',JSON.stringify(v))}
function render(){
 let v=getAll(); document.getElementById('qtd').innerText=v.length+' veículos';
 let h=''; v.forEach(o=>{
   h+=`<div class="card"><div style="display:flex;justify-content:space-between"><div><b style="font-size:19px">${o.nome}</b><div style="opacity:.6;font-size:12px">${o.id}</div></div><div style="color:#7FFF00">● ONLINE 🔋 ${o.bat}%</div></div><div class="row"><button onclick="ver('${o.id}')">📍 Ver Mapa</button><button onclick="cop('${o.id}')">📋 Copiar Link</button></div><div class="row"><button onclick="ren('${o.id}')">✏️ Editar</button><button onclick="del('${o.id}')" style="background:#3a1515">🗑️ Excluir</button></div></div>`;
 }); document.getElementById('lista').innerHTML=h;
}
function add(){let id=prompt('ID (ex: GOL):'); if(!id) return; id=id.toUpperCase().replace(/[^A-Z0-9]/g,''); let nome=prompt('Apelido:')||id; let a=getAll(); if(a.find(x=>x.id==id)){alert('Já existe');return;} a.push({id,nome,bat:90}); saveAll(a); render();}
function del(id){if(!confirm('Excluir '+id+'?'))return; saveAll(getAll().filter(x=>x.id!=id)); render();}
function ren(id){let n=prompt('Novo nome:'); if(!n)return; let a=getAll(); let o=a.find(x=>x.id==id); o.nome=n; saveAll(a); render();}
function ver(id){location.href='rastreador.html?id='+id}
function cop(id){let l='https://negrete79.github.io/Satgps/rastreador.html?id='+id; navigator.clipboard.writeText(l).then(()=>alert('Copiado: '+l));}
render();
</script></body></html>
