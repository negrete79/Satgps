<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seus Dispositivos - PALIO2</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007aff">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#f5f7fb;color:#111}
.header{background:#007aff;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;font-size:18px;font-weight:700}
.list{background:#fff;margin:8px 0}
.device{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee;cursor:pointer}
.device-info b{display:block;font-size:15px} .device-info span{font-size:13px;color:#666}
.btn-icon{width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.btn-blue{background:#e6f0ff;color:#007aff} .btn-green{background:#e6f7ed;color:#0a7a33} .btn-gray{background:#f0f0f0;color:#666}
#mapWrap{display:none;height:55vh} #map{height:100%;width:100%}
.panel{padding:10px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel button{padding:8px 12px;border-radius:8px;border:0;background:#111;color:#fff;font-size:12px}
.badge{padding:3px 8px;border-radius:999px;font-size:11px} .ok{background:#00ff88} .err{background:#ff3b30;color:#fff}
</style>
</head>
<body>
<div class="header"><span>Seus Dispositivos Re...</span><span>⛶ ⋮</span></div>
<div class="list">
<div class="device" onclick="selectDevice('PALIO2')">
<div class="device-info"><b>LG</b><span>LGE LM-X410.F - PALIO2</span></div>
<div style="display:flex;gap:8px">
<button class="btn-icon btn-blue">◎</button>
<button class="btn-icon btn-green">📍</button>
<button class="btn-icon btn-gray">⋯</button>
</div>
</div>
<div class="device" onclick="selectDevice('master')">
<div class="device-info"><b>master</b><span>Motorola moto g42</span></div>
<div><button class="btn-icon btn-gray">◀</button></div>
</div>
</div>
<div id="mapWrap">
<div id="map"></div>
<div class="panel">
<span id="conn" class="badge err">offline</span>
<span id="last">--</span> | <span id="pts">0</span> pts
<button onclick="loadData()">Atualizar</button>
<button onclick="center()">Centralizar</button>
<a id="linkR" href="rastreador.html?id=PALIO2" target="_blank" style="font-size:12px">Rastreador</a>
</div>
</div>
<script>
const CFG={URL:'https://jpaflbkafupwqfqfcjrv.supabase.co',KEY:'sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf',ID:'PALIO2'};
let currentId='PALIO2';
const map=L.map('map').setView([-23.5,-46.6],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker=null,poly=L.polyline([],{color:'#007aff',weight:4}).addTo(map),lastLatLng=null;
function selectDevice(id){currentId=id;CFG.ID=id;document.getElementById('mapWrap').style.display='block';document.getElementById('linkR').href='rastreador.html?id='+encodeURIComponent(id);loadData();setupRealtime();}
async function loadData(){
  try{
    const r=await fetch(CFG.URL+'/rest/v1/posicoes?device_id=eq.'+encodeURIComponent(CFG.ID)+'&order=created_at.desc&limit=100',{headers:{'apikey':CFG.KEY,'Authorization':'Bearer '+CFG.KEY}});
    if(!r.ok)return;
    const data=await r.json();
    if(!data.length){document.getElementById('last').textContent='sem dados';return;}
    document.getElementById('pts').textContent=data.length;
    document.getElementById('last').textContent=new Date(data[0].created_at).toLocaleTimeString('pt-BR');
    poly.setLatLngs(data.map(d=>[d.lat,d.lng]).reverse());
    lastLatLng=[data[0].lat,data[0].lng];
    if(!marker){marker=L.marker(lastLatLng).addTo(map);map.setView(lastLatLng,16);}else marker.setLatLng(lastLatLng);
    document.getElementById('conn').textContent='online';document.getElementById('conn').className='badge ok';
  }catch(e){}
}
function center(){if(lastLatLng)map.setView(lastLatLng,17);}
let channel=null,client=null;
function setupRealtime(){
  if(channel && client){client.removeChannel(channel);}
  client=supabase.createClient(CFG.URL,CFG.KEY);
  channel=client.channel('pos-'+CFG.ID).on('postgres_changes',{event:'INSERT',schema:'public',table:'posicoes',filter:'device_id=eq.'+CFG.ID},p=>{
    const n=p.new;const ll=[n.lat,n.lng];lastLatLng=ll;const cur=poly.getLatLngs();cur.push(ll);poly.setLatLngs(cur);if(marker)marker.setLatLng(ll);
  }).subscribe();
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
selectDevice('PALIO2');
</script>
</body>
</html>
