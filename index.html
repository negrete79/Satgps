<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Palio 2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%;background:#000}
#map{height:100vh;width:100vw}
.glass{background:rgba(20,20,20,0.55)!important;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,0.18)!important;box-shadow:0 4px 20px rgba(0,0,0,0.5);color:#fff!important}
#tipo{position:absolute;top:12px;left:12px;z-index:999;padding:5px;display:flex;gap:6px;border-radius:22px}
#tipo button{padding:9px 14px;border-radius:15px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);font-weight:800;font-size:11px}
#tipo button.ativo{background:rgba(255,255,255,0.95);color:#000;border-color:#fff}
#followBtn{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 22px;border-radius:30px;font-size:11px;font-weight:800;display:none}
#box{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;padding:14px 22px;text-align:center;font-family:system-ui;min-width:300px;border-radius:24px}
#box a{color:#fff!important;text-decoration:none;display:block;margin-top:6px;font-size:12px;font-weight:800}
.leaflet-control-zoom{margin-top:60px!important;border:none!important}
.leaflet-control-zoom a{background:rgba(20,20,20,0.55)!important;color:#fff!important;border-color:rgba(255,255,255,0.15)!important}
</style>
</head>
<body>
<div id="map"></div>

<div id="tipo" class="glass">
<button id="bSat" class="ativo" onclick="setTipo('sat')">🛰️ SATÉLITE</button>
<button id="bRua" onclick="setTipo('rua')">🗺️ RUA</button>
</div>

<button id="followBtn" class="glass" onclick="voltar()">📍 VOLTAR AO CARRO</button>

<div id="box" class="glass">
<div>🟢 PALIO 2 - <span id="status">...</span></div>
<a id="gmap" href="#" target="_blank">IR PARA O GOOGLE MAPS</a>
<div style="margin-top:6px;font-size:9px;opacity:0.4">Crédito Elias Costa NEGRET'S</div>
</div>

<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let seguir=true;
const sat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20});
const rua = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20});
const map = L.map('map',{layers:[sat], zoomControl:true}).setView([-20.3881,-43.7569],17);
let m=L.marker([-20.3881,-43.7569]).addTo(map);

function setTipo(t){
  if(t=='sat'){ map.removeLayer(rua); if(!map.hasLayer(sat)) map.addLayer(sat); document.getElementById('bSat').className='ativo'; document.getElementById('bRua').className='';}
  else{ map.removeLayer(sat); if(!map.hasLayer(rua)) map.addLayer(rua); document.getElementById('bRua').className='ativo'; document.getElementById('bSat').className='';}
}
map.on('dragstart',()=>{if(seguir){seguir=false;document.getElementById('followBtn').style.display='block';}});
function voltar(){seguir=true;document.getElementById('followBtn').style.display='none';map.flyTo(m.getLatLng(),17,{duration:1.2});}

async function up(){
  try{
    let r=await fetch(`${U}/rest/v1/rastreador?device_id=eq.Palio2&order=updated_at.desc&limit=1`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:'no-store'});
    let d=await r.json(); if(!d[0])return;
    m.setLatLng([d[0].lat,d[0].lng]);
    document.getElementById('gmap').href=`https://www.google.com/maps?q=${d[0].lat},${d[0].lng}`;
    let diff=(Date.now()-new Date(d[0].updated_at).getTime())/1000/60;
    document.getElementById('status').innerText=diff<2?'ONLINE':`PARADO HÁ ${Math.round(diff)}min`;
    if(seguir) map.panTo([d[0].lat,d[0].lng]);
  }catch(e){}
}
up();setInterval(up,8000);
setTimeout(()=>map.invalidateSize(),500);
</script>
</body>
</html>
