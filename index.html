<title>SatGPS - Frota PRO</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0a; --bg-2:#111;
    --glass:rgba(255,255,255,0.04); --glass-2:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.08); --border-2:rgba(255,255,255,0.15);
    --primary:#a6ff00; --primary-dim:#7acc00;
    --text:#fff; --text-dim:rgba(255,255,255,0.6); --text-faint:rgba(255,255,255,0.4);
    --danger:#ff4444; --warning:#ffaa00;
    --r:24px; --r-sm:16px; --r-md:20px;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .hidden{display:none!important}
  .screen{height:100%;width:100%}

  /* ===== LOGIN ===== */
  #login{display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{
    width:100%;max-width:380px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
    border:1px solid var(--border);border-radius:var(--r);padding:36px 28px
  }
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
  .logo svg{width:42px;height:42px}
  .logo h1{font-size:26px;font-weight:700;letter-spacing:-0.5px}
  .logo h1 b{color:var(--primary)}
  .subtitle{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:30px;letter-spacing:0.3px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);margin-bottom:8px}
  .field input{
    width:100%;padding:14px 16px;background:rgba(0,0,0,0.4);border:1px solid var(--border);
    border-radius:var(--r-sm);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:all .2s
  }
  .field input:focus{border-color:var(--primary);background:rgba(0,0,0,0.6)}
  .btn-primary{
    width:100%;padding:15px;background:var(--primary);color:#0a0a0a;border:none;border-radius:var(--r-sm);
    font-size:14px;font-weight:700;letter-spacing:0.5px;cursor:pointer;transition:all .2s;font-family:inherit;
    margin-top:6px
  }
  .btn-primary:hover{background:#b8ff33;transform:translateY(-1px)}
  .btn-primary:active{transform:translateY(0)}
  .login-error{color:var(--danger);font-size:12px;text-align:center;margin-top:14px;min-height:16px}

  /* ===== DASHBOARD ===== */
  #dash{display:flex;flex-direction:column;height:100%}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
    background:rgba(10,10,10,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10
  }
  .topbar .brand{display:flex;align-items:center;gap:10px}
  .topbar .brand svg{width:24px;height:24px}
  .topbar .brand h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
  .topbar .brand h1 b{color:var(--primary)}
  .btn-icon{
    width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--border);
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s
  }
  .btn-icon:hover{background:var(--glass-2);border-color:var(--border-2)}
  .btn-icon svg{width:18px;height:18px}

  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px
  }
  .stat-card{
    background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 12px;text-align:center
  }
  .stat-card .val{font-size:24px;font-weight:700;letter-spacing:-0.5px}
  .stat-card .val.online{color:var(--primary)}
  .stat-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);margin-top:4px}

  .actions-bar{padding:0 16px 10px}
  .btn-add{
    width:100%;padding:14px;background:var(--primary);color:#0a0a0a;border:none;border-radius:var(--r-sm);
    font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:all .2s;font-family:inherit;letter-spacing:0.3px
  }
  .btn-add:hover{background:#b8ff33}

  .list{flex:1;overflow-y:auto;padding:8px 16px 24px;-webkit-overflow-scrolling:touch}
  .empty{text-align:center;padding:60px 20px;color:var(--text-faint)}
  .empty svg{width:48px;height:48px;opacity:0.3;margin-bottom:14px}
  .empty p{font-size:13px;line-height:1.5}

  .vcard{
    background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;transition:all .2s
  }
  .vcard:hover{border-color:var(--border-2)}
  .vcard-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .vcard-name{font-size:18px;font-weight:700;letter-spacing:-0.3px;line-height:1.2}
  .vcard-id{font-size:11px;color:var(--text-faint);font-family:ui-monospace,monospace;margin-top:3px;letter-spacing:0.5px}
  .badge{
    padding:5px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
    display:flex;align-items:center;gap:5px
  }
  .badge.online{background:rgba(166,255,0,0.15);color:var(--primary)}
  .badge.offline{background:rgba(255,68,68,0.15);color:var(--danger)}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.online::before{box-shadow:0 0 6px var(--primary)}

  .vcard-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;color:var(--text-dim)}
  .vcard-meta .battery{display:flex;align-items:center;gap:6px;font-weight:600}
  .vcard-meta .battery-icon{display:inline-flex;width:22px;height:11px;border:1.5px solid currentColor;border-radius:2px;position:relative}
  .vcard-meta .battery-icon::after{content:'';position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
  .vcard-meta .battery-fill{position:absolute;top:1px;left:1px;bottom:1px;background:currentColor;border-radius:1px;transition:all .3s}

  .vcard-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .vbtn{
    padding:11px 8px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;
    color:var(--text);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:5px
  }
  .vbtn:hover{background:var(--glass-2);border-color:var(--border-2)}
  .vbtn svg{width:16px;height:16px}
  .vbtn.danger:hover{background:rgba(255,68,68,0.15);border-color:var(--danger);color:var(--danger)}

  /* ===== MODAIS ===== */
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:999;display:flex;align-items:flex-end;justify-content:center;padding:0
  }
  .modal{
    width:100%;max-width:480px;background:#131313;border:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto
  }
  .modal h2{font-size:18px;font-weight:700;letter-spacing:-0.3px;margin-bottom:6px}
  .modal p.sub{font-size:12px;color:var(--text-dim);margin-bottom:22px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .btn-secondary{
    flex:1;padding:13px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;
    color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit
  }
  .btn-secondary:hover{background:var(--glass-2)}
  .btn-danger{flex:1;padding:13px;background:rgba(255,68,68,0.15);border:1px solid rgba(255,68,68,0.4);border-radius:12px;color:var(--danger);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-danger:disabled{opacity:0.4;cursor:not-allowed}

  .modal .field input:disabled{opacity:0.5;cursor:not-allowed}

  /* ===== TOAST ===== */
  #toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);z-index:9999;
    background:rgba(20,20,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:#fff;padding:14px 22px;border-radius:14px;border:1px solid var(--border-2);
    font-size:13px;font-weight:600;transition:transform .3s ease;max-width:90vw;text-align:center
  }
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.error{border-color:rgba(255,68,68,0.4)}

  /* ===== RESPONSIVO ===== */
  @media (max-width:380px){
    .stat-card .val{font-size:20px}
    .stats{gap:6px;padding:12px}
    .stat-card{padding:12px 8px}
  }
  @media (min-width:768px){
    .modal-bg{align-items:center;padding:24px}
    .modal{border-radius:var(--r)}
  }
</style>
</head>
<body>

<div id="toast"></div>

<script>
/* ============================================================
   SatGPS - Frota PRO - Painel
   ============================================================ */

const U = "https://jpaflbkafupwqfqfcjrv.supabase.co";
const K = "sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const H = { apikey: K, Authorization: "Bearer " + K, "Content-Type": "application/json" };
const BASE_URL = "https://negrete79.github.io/Satgps/";

const ONLINE_MS = 2 * 60 * 1000;       // 2 min = online
const REFRESH_MS = 6000;                // 6 segundos
const DEFAULT_LAT = -24.120;            // localização inicial
const DEFAULT_LNG = -48.345;

let vehicles = [];
let editingId = null;
let deletingId = null;

/* ===== LOGIN ===== */
function checkSession() {
  if (localStorage.getItem('satgps_session') === 'ok') {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    refresh();
    if (!window._refreshTimer) window._refreshTimer = setInterval(refresh, REFRESH_MS);
  }
}

document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  if (u === 'admin' && p === '1234') {
    localStorage.setItem('satgps_session', 'ok');
    document.getElementById('loginError').innerText = '';
    checkSession();
  } else {
    document.getElementById('loginError').innerText = 'Usuário ou senha incorretos';
  }
});

function logout() {
  localStorage.removeItem('satgps_session');
  location.reload();
}

/* ===== TOAST ===== */
let toastTimer = null;
function toast(msg, error = false) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = error ? 'error show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ===== STATUS ===== */
function isOnline(updated_at) {
  if (!updated_at) return false;
  return (Date.now() - new Date(updated_at).getTime()) < ONLINE_MS;
}

function timeAgo(updated_at) {
  if (!updated_at) return 'nunca';
  const s = Math.floor((Date.now() - new Date(updated_at).getTime()) / 1000);
  if (s < 0) return 'agora';
  if (s < 60) return `há ${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `há ${m}min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h}h`;
  const d = Math.floor(h / 24);
  return `há ${d}d`;
}

/* ===== NOMES (localStorage) ===== */
function getNames() { return JSON.parse(localStorage.getItem('satgps_names') || '{}'); }
function setName(id, name) { const n = getNames(); n[id] = name; localStorage.setItem('satgps_names', JSON.stringify(n)); }
function getName(id) { return getNames()[id] || id; }

/* ===== FETCH VEÍCULOS ===== */
async function refresh() {
  try {
    const r = await fetch(`${U}/rest/v1/rastreador?order=updated_at.desc`, { headers: H, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    vehicles = await r.json();
    render();
  } catch (e) {
    toast('Erro ao atualizar: ' + e.message, true);
  }
}

/* ===== RENDER ===== */
function render() {
  // Stats
  const total = vehicles.length;
  const online = vehicles.filter(v => isOnline(v.updated_at)).length;
  const withBat = vehicles.filter(v => v.battery > 0);
  const avgBat = withBat.length ? Math.round(withBat.reduce((s, v) => s + v.battery, 0) / withBat.length) : 0;

  document.getElementById('stat-total').innerText = total;
  document.getElementById('stat-online').innerText = online;
  document.getElementById('stat-battery').innerText = avgBat + '%';

  // Lista
  const list = document.getElementById('vlist');
  if (!vehicles.length) {
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
        <p>Nenhum veículo cadastrado<br>Clique em "Adicionar Veículo" para começar</p>
      </div>`;
    return;
  }

  list.innerHTML = vehicles.map(v => {
    const online_ = isOnline(v.updated_at);
    const name = getName(v.device_id);
    const bat = v.battery || 0;
    const batColor = bat > 50 ? '#a6ff00' : bat > 20 ? '#ffaa00' : '#ff4444';
    return `
      <div class="vcard">
        <div class="vcard-head">
          <div>
            <div class="vcard-name">${escapeHtml(name)}</div>
            <div class="vcard-id">${escapeHtml(v.device_id)}</div>
          </div>
          <span class="badge ${online_ ? 'online' : 'offline'}">${online_ ? 'Online' : 'Offline'}</span>
        </div>
        <div class="vcard-meta">
          <span>${timeAgo(v.updated_at)}</span>
          <span class="battery" style="color:${batColor}">
            <span class="battery-icon"><span class="battery-fill" style="width:${Math.min(bat,100)}%"></span></span>
            ${bat}%
          </span>
        </div>
        <div class="vcard-actions">
          <button class="vbtn" onclick="viewMap('${escapeAttr(v.device_id)}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
            Ver Mapa
          </button>
          <button class="vbtn" onclick="openLink('${escapeAttr(v.device_id)}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
            Abrir Link
          </button>
          <button class="vbtn" onclick="copyLink('${escapeAttr(v.device_id)}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            Copiar
          </button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <button class="vbtn" onclick="openEdit('${escapeAttr(v.device_id)}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            Editar
          </button>
          <button class="vbtn danger" onclick="openDelete('${escapeAttr(v.device_id)}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Excluir
          </button>
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s||'').replace(/'/g, "\\'"); }

/* ===== AÇÕES ===== */
function viewMap(id) { window.open(`./rastreador.html?id=${encodeURIComponent(id)}`, '_blank'); }
function openLink(id) { window.open(`./rastreador.html?id=${encodeURIComponent(id)}`, '_blank'); }
async function copyLink(id) {
  const url = `${BASE_URL}rastreador.html?id=${encodeURIComponent(id)}`;
  try {
    await navigator.clipboard.writeText(url);
    toast('Link copiado!');
  } catch (e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Link copiado!'); } catch(_) { toast('Erro ao copiar', true); }
    document.body.removeChild(ta);
  }
}

/* ===== ADD/EDIT ===== */
function openAdd() {
  editingId = null;
  document.getElementById('modalFormTitle').innerText = 'Adicionar Veículo';
  document.getElementById('fName').value = '';
  document.getElementById('fId').value = '';
  document.getElementById('fId').disabled = false;
  document.getElementById('fId').placeholder = 'Ex: PALIO1, MOTO, CORSA1';
  document.getElementById('modalForm').classList.remove('hidden');
  setTimeout(() => document.getElementById('fName').focus(), 100);
}

function openEdit(id) {
  const v = vehicles.find(x => x.device_id === id);
  if (!v) return;
  editingId = id;
  document.getElementById('modalFormTitle').innerText = 'Editar Veículo';
  document.getElementById('fName').value = getName(id);
  document.getElementById('fId').value = id;
  document.getElementById('fId').disabled = true;
  document.getElementById('modalForm').classList.remove('hidden');
  setTimeout(() => document.getElementById('fName').focus(), 100);
}

async function saveVehicle() {
  const name = document.getElementById('fName').value.trim();
  const id = document.getElementById('fId').value.trim();

  if (!name) { toast('Informe o nome', true); return; }
  if (!id) { toast('Informe o ID', true); return; }
  if (!/^[A-Za-z0-9_-]+$/.test(id)) { toast('ID só pode ter letras, números, _ e -', true); return; }

  if (editingId) {
    // Edit - só atualiza o nome (em localStorage)
    setName(editingId, name);
    closeModal('modalForm');
    toast('Veículo atualizado');
    render();
    return;
  }

  // Add - upsert no Supabase
  try {
    const r = await fetch(`${U}/rest/v1/rastreador`, {
      method: 'POST',
      headers: { ...H, "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify({
        device_id: id,
        lat: DEFAULT_LAT,
        lng: DEFAULT_LNG,
        battery: 0,
        updated_at: new Date().toISOString()
      })
    });
    if (!r.ok) {
      const err = await r.text();
      throw new Error(`HTTP ${r.status}${r.status === 401 || r.status === 403 ? ' - Verifique RLS do Supabase' : ''}`);
    }
    setName(id, name);
    closeModal('modalForm');
    toast(`Veículo ${id} criado! Link pronto.`);
    await refresh();
  } catch (e) {
    toast('Erro: ' + e.message, true);
  }
}

/* ===== DELETE ===== */
function openDelete(id) {
  const v = vehicles.find(x => x.device_id === id);
  if (!v) return;
  deletingId = id;
  document.getElementById('delName').innerText = getName(id);
  document.getElementById('delId').innerText = id;
  document.getElementById('delConfirm').value = '';
  document.getElementById('delBtn').disabled = true;
  document.getElementById('modalDel').classList.remove('hidden');
}

document.getElementById('delConfirm').addEventListener('input', e => {
  document.getElementById('delBtn').disabled = e.target.value !== deletingId;
});

async function confirmDelete() {
  try {
    const r = await fetch(`${U}/rest/v1/rastreador?device_id=eq.${encodeURIComponent(deletingId)}`, {
      method: 'DELETE', headers: H
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // Remove nome do localStorage
    const names = getNames();
    delete names[deletingId];
    localStorage.setItem('satgps_names', JSON.stringify(names));
    closeModal('modalDel');
    toast(`Veículo ${deletingId} excluído`);
    deletingId = null;
    await refresh();
  } catch (e) {
    toast('Erro ao excluir: ' + e.message, true);
  }
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

// Fecha modal clicando fora
document.querySelectorAll('.modal-bg').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); });
});

/* ===== SERVICE WORKER ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});
}

/* ===== START ===== */
checkSession();
</script>
