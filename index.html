<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SatGPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000}
#map{height:100vh;width:100vw}
.glass{background: rgba(20,20,20,0.55) !important; backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15) !important; color:#fff !important;}
#selector{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:999;padding:5px;display:flex;gap:6px;border-radius:22px}
#selector button{padding:9px 15px;border-radius:15px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.08);color:#fff;font-weight:700;font-size:11px}
#selector button.ativo{background:#fff;color:#000}
#followBtn{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);z-index:999;padding:13px 26px;font-size:11px;font-weight:800;border-radius:30px;display:none}
#box{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;padding:14px 22px;text-align:center;font-family:system-ui;min-width:320px;border-radius:24px}
#box a{color:#b6ff00 !important;text-decoration:none;display:block;margin-top:8px;font-size:13px;font-weight:900}
#credito{margin-top:8px;font-size:9px;opacity:0.4}
#line2{margin-top:6px;font-size:11px;display:flex;gap:10px;justify-content:center}
#status.online{color:#4ade80} #status.offline{color:#ff5555}
</style>
</head>
<body>
<div id="map"></div>
<div id="selector" class="glass">
<button id="btn1" class="ativo" onclick="trocar('PALIO1')">PALIO 1</button>
<button id="btn2" onclick="trocar('PALIO2')">PALIO 2</button>
</div>
<button id="followBtn" class="glass" onclick="voltar()">📍 VOLTAR AO CARRO</button>
<div id="box" class="glass">
<div><span id="statusIcon">⚫</span> <span id="nome">PALIO 1</span> - <span id="qtd">0</span> pts</div>
<div id="line2">
<span id="status" class="offline">● OFFLINE</span>
<span id="bateria">🔋 --%</span>
<span id="tempo">--</span>
</div>
<a id="gmap" href="#" target="_blank">IR PARA O GOOGLE MAPS</a>
<div id="credito">Crédito criado por Elias Costa NEGRET'S</div>
</div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let ATUAL="PALIO1", seguir=true, primeiro=true;
const sat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20});
const map = L.map('map',{layers:[sat], zoomControl:false}).setView([-20.3881,-43.7569],17);
let m=L.marker([-20.3881,-43.7569]).addTo(map);
let poly=L.polyline([],{color:'#ff0000',weight:3}).addTo(map);
function voltar(){seguir=true;primeiro=true;document.getElementById('followBtn').style.display='none';map.flyTo(m.getLatLng(),17);}
function trocar(c){ATUAL=c;document.getElementById('btn1').className=c=='PALIO1'?'ativo':'';document.getElementById('btn2').className=c=='PALIO2'?'ativo':'';document.getElementById('nome').innerText=c.replace('PALIO','PALIO ');poly.setLatLngs([]);primeiro=true;up();}
function tempoAtras(iso){ let diff=(Date.now()-new Date(iso).getTime())/1000; if(diff<60) return 'agora'; if(diff<3600) return Math.floor(diff/60)+' min'; return Math.floor(diff/3600)+'h'; }
async function up(){
  let r=await fetch(`${U}/rest/v1/rastreador?device_id=eq.${ATUAL}&limit=1&order=updated_at.desc`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:'no-store'});
  let d=await r.json(); if(!d[0]) return;
  m.setLatLng([d[0].lat,d[0].lng]);
  document.getElementById('gmap').href=`https://www.google.com/maps?q=${d[0].lat},${d[0].lng}`;
  let mins=(Date.now()-new Date(d[0].updated_at).getTime())/60000;
  document.getElementById('status').innerText=mins<10?'● ONLINE':'● OFFLINE';
  document.getElementById('status').className=mins<10?'online':'offline';
  document.getElementById('statusIcon').innerText=mins<10?'🟢':'🔴';
  document.getElementById('tempo').innerText=tempoAtras(d[0].updated_at);
  if(d[0].battery!=null) document.getElementById('bateria').innerText=`🔋 ${Math.round(d[0].battery)}%`;
  let rh=await fetch(`${U}/rest/v1/rastreador_historico?device_id=eq.${ATUAL}&order=created_at.asc&limit=500`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:'no-store'});
  let h=await rh.json(); if(h.length){ poly.setLatLngs(h.map(x=>[x.lat,x.lng])); document.getElementById('qtd').innerText=h.length; if(primeiro){map.setView([d[0].lat,d[0].lng],17);primeiro=false;} else if(seguir) map.panTo([d[0].lat,d[0].lng]); }
}
map.on('dragstart',()=>{seguir=false;document.getElementById('followBtn').style.display='block';});
setTimeout(()=>map.invalidateSize(),500); up(); setInterval(up,10000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }
</script>
</body>
</html>
