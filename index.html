<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatGPS - Frota</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--lime:#b6ff00;--bg:#0a0a0a;--card:#171717;--border:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 20px}
.logo{font-weight:800;font-size:24px;display:flex;gap:8px;align-items:center}
.logo span{color:var(--lime)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;text-align:center}
.stat b{font-size:28px;display:block}
.stat span{font-size:12px;letter-spacing:1px;color:#888}
.btn-lime{background:var(--lime);color:#000;border:0;width:100%;padding:18px;border-radius:20px;font-weight:800;font-size:16px;display:flex;gap:10px;justify-content:center;align-items:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;margin-top:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-size:22px;font-weight:800}
.sub{color:#888;font-family:monospace;font-size:14px;margin-top:2px}
.badge{font-size:12px;padding:6px 12px;border-radius:20px;font-weight:700}
.offline{background:#3a1a1a;color:#ff4d4d}
.online{background:#1a3a1a;color:var(--lime)}
.info{margin:14px 0;display:flex;justify-content:space-between;color:#aaa;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{border:1px solid var(--border);background:#222;border-radius:16px;padding:14px 6px;color:#fff;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center}
#mapModal{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}
#map{flex:1}
#mapHeader{padding:16px;display:flex;justify-content:space-between;align-items:center;background:#111}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🛰️ Sat<span>GPS</span></div>
  <button onclick="location.reload()" style="background:#222;border:1px solid #333;border-radius:50%;width:44px;height:44px;color:#fff">↗</button>
</div>

<div class="stats">
  <div class="stat"><b id="total">0</b><span>TOTAL</span></div>
  <div class="stat"><b id="on" style="color:var(--lime)">0</b><span>ONLINE</span></div>
  <div class="stat"><b id="bat">0%</b><span>BATERIA</span></div>
</div>

<button class="btn-lime" onclick="addVeiculo()">+ Adicionar Veículo</button>

<div id="lista"></div>

<div id="mapModal">
  <div id="mapHeader">
    <b id="mapTitle">Mapa</b>
    <button onclick="fecharMapa()" style="background:var(--lime);border:0;padding:10px 18px;border-radius:12px;font-weight:800">Fechar</button>
  </div>
  <div id="map"></div>
</div>

<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let map, marker;

async function carregar(){
  const r=await fetch(`${U}/rest/v1/rastreador?select=*`,{headers:{apikey:K,Authorization:"Bearer "+K}});
  const dados=await r.json();
  document.getElementById('total').innerText=dados.length;
  let online=0, batMax=0;
  let html="";
  dados.forEach(v=>{
    const diffMin = (Date.now()-new Date(v.updated_at).getTime())/60000;
    const isOn = diffMin < 5;
    if(isOn) online++;
    batMax=Math.max(batMax, v.battery||0);
    html+=`
    <div class="card">
      <div class="top">
        <div><div class="name">${v.device_id}</div><div class="sub">${v.device_id}</div></div>
        <div class="badge ${isOn?'online':'offline'}">● ${isOn?'ONLINE':'OFFLINE'}</div>
      </div>
      <div class="info"><span>há ${Math.round(diffMin)}min</span><span style="color:var(--lime);font-weight:700">🔋 ${v.battery||0}%</span></div>
      <div class="actions">
        <button class="btn" onclick="verMapa(${v.lat},${v.lng},'${v.device_id}')">📍<span>Ver Mapa</span></button>
        <button class="btn" onclick="abrirLink('${v.device_id}')">🔗<span>Abrir Link</span></button>
        <button class="btn" onclick="copiar('${v.device_id}')">📄<span>Copiar</span></button>
      </div>
      <div class="actions2">
        <button class="btn" onclick="editar('${v.device_id}')">🖊️<span>Editar</span></button>
        <button class="btn" onclick="excluir('${v.device_id}')">🗑️<span>Excluir</span></button>
      </div>
    </div>`;
  });
  document.getElementById('on').innerText=online;
  document.getElementById('bat').innerText=batMax+"%";
  document.getElementById('lista').innerHTML=html||"<p style='text-align:center;color:#555;margin-top:40px'>Nenhum veículo</p>";
}
function verMapa(lat,lng,id){
  document.getElementById('mapModal').style.display='flex';
  document.getElementById('mapTitle').innerText=id;
  setTimeout(()=>{
    if(!map){map=L.map('map').setView([lat,lng],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);}
    else{map.setView([lat,lng],16);}
    if(marker) map.removeLayer(marker);
    marker=L.marker([lat,lng]).addTo(map).bindPopup(id).openPopup();
  },100);
}
function fecharMapa(){document.getElementById('mapModal').style.display='none';}
function abrirLink(id){window.open(`https://negrete79.github.io/Satgps/rastreador.html?id=${id}`,'_blank');}
function copiar(id){navigator.clipboard.writeText(`https://negrete79.github.io/Satgps/rastreador.html?id=${id}`);alert('Link copiado: '+id);}
function addVeiculo(){let id=prompt('Nome do veículo (ex: PALIO2):');if(id){abrirLink(id.toUpperCase());}}
function editar(id){alert('Editar: '+id+' - por enquanto muda o nome no link ?id=');}
async function excluir(id){if(confirm('Excluir '+id+'?')){await fetch(`${U}/rest/v1/rastreador?device_id=eq.${id}`,{method:'DELETE',headers:{apikey:K,Authorization:"Bearer "+K}});carregar();}}

carregar();setInterval(carregar,15000);
</script>
</body>
</html>
