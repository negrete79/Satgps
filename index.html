<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rastreador · Mapa da Frota</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b1220;color:#e2e8f0;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  #mapa{position:fixed;inset:0;z-index:0}

  /* ---------- painel lateral ---------- */
  #painel{position:fixed;top:0;left:0;bottom:0;width:330px;max-width:88vw;z-index:1200;
    background:rgba(10,16,30,.94);backdrop-filter:blur(10px);
    border-right:1px solid #22304d;display:flex;flex-direction:column;
    transition:transform .25s ease}
  #painel.fechado{transform:translateX(-102%)}
  #painel header{position:relative;padding:14px 16px 12px;border-bottom:1px solid #1b2740;flex:none}
  #painel h1{font-size:15px;font-weight:800;letter-spacing:.12em;color:#f1f5f9}
  #painel h1 small{display:block;font-weight:500;letter-spacing:0;font-size:11px;color:#7c8db0;margin-top:2px}
  #btnFechar{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:8px;
    border:1px solid #2a3c60;background:#152238;color:#e2e8f0;font-size:14px;cursor:pointer}
  .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:3px 10px;border-radius:99px;background:#152238;
    border:1px solid #24365a;color:#9fb0d0}
  .chip b{color:#fff}
  .chip.on b{color:#4ade80}
  #sync{margin-top:8px;font-size:11px;color:#64748b}

  #lista{flex:1;overflow-y:auto}
  #lista::-webkit-scrollbar{width:6px}
  #lista::-webkit-scrollbar-thumb{background:#24365a;border-radius:3px}
  .carregando{padding:30px 18px;text-align:center;color:#7c8db0;font-size:13px;line-height:1.7}
  .card{padding:11px 14px;border-bottom:1px solid #16203a;cursor:pointer}
  .card:hover{background:#121d36}
  .card .l1{display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.9)}
  .dot.off{background:#ef4444}
  .nome{font-weight:700;font-size:14px;color:#f1f5f9;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .quando{font-size:11px;flex:none}
  .quando.on{color:#4ade80}
  .quando.off{color:#f87171}
  .card .l2{display:flex;gap:10px;margin-top:5px;font-size:11.5px;color:#8ea0c4;
    align-items:center;flex-wrap:wrap}
  .bat.ok{color:#4ade80}
  .bat.mid{color:#fbbf24}
  .bat.low{color:#f87171}

  /* ---------- botão hambúrguer (painel fechado) ---------- */
  #btnMenu{display:none;position:fixed;top:12px;left:12px;z-index:1300;width:40px;height:40px;
    border-radius:10px;border:1px solid #2a3c60;background:rgba(10,16,30,.92);
    color:#e2e8f0;font-size:18px;cursor:pointer}

  /* ---------- marcadores ---------- */
  .mk{background:none;border:none}
  .ponto{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.95);box-shadow:0 1px 6px rgba(0,0,0,.65)}
  .ponto.on{background:#22c55e}
  .ponto.off{background:#ef4444}
  .ponto.on::before{content:'';position:absolute;inset:-2px;border-radius:50%;
    border:2px solid #22c55e;animation:pulsar 2s ease-out infinite}
  .etiqueta{position:absolute;left:12px;top:-10px;background:rgba(8,14,28,.88);
    border:1px solid #24365a;color:#f1f5f9;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:99px;white-space:nowrap}
  @keyframes pulsar{0%{transform:scale(1);opacity:.9}70%{transform:scale(2.4);opacity:0}
    100%{transform:scale(2.4);opacity:0}}

  /* ---------- popup dark ---------- */
  .leaflet-popup-content-wrapper{background:#0e1730;color:#e2e8f0;border:1px solid #24365a;
    border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .leaflet-popup-tip{background:#0e1730;border:1px solid #24365a}
  .leaflet-popup-content{margin:10px 14px}
  .leaflet-container{font-family:inherit}
  .leaflet-control-attribution{background:rgba(10,16,30,.8)!important;color:#64748b!important}
  .leaflet-control-attribution a{color:#93a4c3!important}
  .pop-nome{font-weight:800;font-size:14px;display:flex;justify-content:space-between;
    gap:12px;align-items:center;margin-bottom:6px}
  .pop-estado{font-size:11px;font-weight:700}
  .pop-estado.on{color:#4ade80}
  .pop-estado.off{color:#f87171}
  .pop-linha{font-size:12px;color:#b6c4e0;padding:1.5px 0}
</style>
</head>
<body>

<div id="mapa"></div>

<button id="btnMenu" title="abrir painel">☰</button>

<aside id="painel">
  <header>
    <button id="btnFechar" title="fechar painel">✕</button>
    <h1>🛰️ RASTREADOR
      <small>monitor da frota em tempo real</small>
    </h1>
    <div class="chips">
      <span class="chip on"><b id="qtdOnline">0</b> ONLINE</span>
      <span class="chip"><b id="qtdTotal">0</b> VEÍCULOS</span>
    </div>
    <div id="sync">Carregando frota...</div>
  </header>
  <div id="lista"><div class="carregando">Carregando frota...</div></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ======================================================================
   CONFIGURAÇÃO — REST direto no Supabase (sem importmap / sem supabase-js)
   ====================================================================== */
var CONFIG = {
  SUPABASE_URL: 'https://wzjhyoyggthasgjygcvo.supabase.co',
  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6amh5b3lnZ3RoYXNnanlnY3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwNjUxMTMsImV4cCI6MjA3ODY0MTExM30.k1af6Xy2MoFihd3wBOaN2vE-EWWv2ewG2y5Gwu1I5yVw',
  ONLINE_MS:   10 * 60 * 1000,  // ONLINE se última posição < 10 minutos
  ATUALIZA_MS: 15000            // atualiza o mapa a cada 15 s
};

/* ================= MAPA: Leaflet + Esri World Imagery + OSM 0.4 ====== */
var map = L.map('mapa', { zoomControl: false }).setView([-15.0, -47.0], 4);
L.control.zoom({ position: 'bottomright' }).addTo(map);

var esri = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Imagens © Esri' }
).addTo(map);

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, opacity: 0.4, attribution: '© OpenStreetMap'
}).addTo(map);

L.control.layers(
  { 'Satélite Esri': esri },
  { 'Ruas OSM (0.4)': osm },
  { position: 'bottomright', collapsed: true }
).addTo(map);

/* ================= ESTADO ============================================ */
var marcadores = {};           // veiculo_id -> L.marker
var ajustouPrimeiraVez = false;
var buscando = false;

/* ================= UTILITÁRIOS ======================================= */
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* created_at pode voltar como timestamptz (+00:00 / Z) ou timestamp sem
   fuso — no Supabase esse último é UTC, então completamos com Z */
function parseData(s) {
  if (!s) return null;
  if (/[zZ]$/.test(s) || /[+-]\d{2}:?\d{2}$/.test(s)) return new Date(s);
  return new Date(s + 'Z');
}

function classeBat(b) {
  if (b == null) return '';
  if (b > 60) return 'ok';
  if (b >= 25) return 'mid';
  return 'low';
}

/* ================= BUSCA (fetch REST direto) ========================= */
function buscar() {
  if (buscando) return;
  buscando = true;
  fetch(CONFIG.SUPABASE_URL + '/rest/v1/posicoes?select=*&order=created_at.desc&limit=500', {
    headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY },
    cache: 'no-store'
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (rows) {
      try { render(rows); } catch (e) { mostrarErro('Erro ao processar: ' + e.message); }
      buscando = false;
    })
    .catch(function (e) {
      mostrarErro('Erro ao carregar frota: ' + e.message);
      buscando = false;
    });
}

function mostrarErro(msg) {
  document.getElementById('sync').textContent = '⚠️ ' + msg + ' · tenta de novo em 15 s';
  var lista = document.getElementById('lista');
  if (lista.dataset.erro !== '1') {
    lista.dataset.erro = '1';
    lista.innerHTML = '<div class="carregando">⚠️ ' + esc(msg) +
      '<br><small>Verifique a KEY e as regras RLS da tabela <b>posicoes</b>.<br>' +
      'Nova tentativa em 15 s…</small></div>';
  }
}

/* ================= RENDER ============================================ */
function render(rows) {
  var agora = Date.now();
  var frota = {};   // veiculo_id -> { d, pts, ts, online, diffMin }
  var ordem = [];

  for (var i = 0; i < rows.length; i++) {
    var d = rows[i];
    var id = d.veiculo_id;
    if (!frota[id]) {
      var ts = parseData(d.created_at);
      var diff = ts ? agora - ts.getTime() : Infinity;
      var online = ts != null && diff >= -60000 && diff < CONFIG.ONLINE_MS;
      frota[id] = {
        d: d, pts: 1, ts: ts, online: online,
        diffMin: diff === Infinity ? null : Math.max(0, Math.floor(diff / 60000))
      };
      ordem.push(id);
    } else {
      frota[id].pts++;
    }
  }

  ordem.sort(function (a, b) {
    var A = frota[a], B = frota[b];
    if (A.online !== B.online) return A.online ? -1 : 1;
    return (B.ts ? B.ts.getTime() : 0) - (A.ts ? A.ts.getTime() : 0);
  });

  var onlineQtd = 0;
  ordem.forEach(function (id) { if (frota[id].online) onlineQtd++; });
  document.getElementById('qtdOnline').textContent = onlineQtd;
  document.getElementById('qtdTotal').textContent = ordem.length;
  document.getElementById('sync').textContent =
    '↻ atualiza a cada 15 s · sync ' + new Date().toLocaleTimeString('pt-BR') +
    ' · ' + rows.length + ' registros';

  /* ---- lista lateral ---- */
  var html = '';
  ordem.forEach(function (id) {
    var v = frota[id];
    var quando = v.online ? 'agora' : (v.diffMin != null ? v.diffMin + ' min atrás' : '—');
    var bat = v.d.bateria == null ? '—' : v.d.bateria + '%';
    html += '<div class="card" data-id="' + esc(id) + '">' +
      '<div class="l1"><span class="dot ' + (v.online ? 'on' : 'off') + '"></span>' +
      '<span class="nome">' + esc(id) + '</span>' +
      '<span class="quando ' + (v.online ? 'on' : 'off') + '">' + quando + '</span></div>' +
      '<div class="l2">' +
      '<span class="bat ' + classeBat(v.d.bateria) + '">🔋 ' + bat + '</span>' +
      '<span>📶 ' + v.pts + ' pts</span>' +
      '<span>' + Number(v.d.lat).toFixed(5) + ', ' + Number(v.d.lon).toFixed(5) + '</span>' +
      '</div></div>';
  });
  if (!ordem.length) {
    html = '<div class="carregando">Nenhum registro ainda.<br><small>Abra no celular:<br>' +
      '<b>rastreador.html?id=SEUVEICULO</b></small></div>';
  }
  var lista = document.getElementById('lista');
  lista.dataset.erro = '';
  var scrollAntigo = lista.scrollTop;
  lista.innerHTML = html;
  lista.scrollTop = scrollAntigo;

  Array.prototype.forEach.call(lista.querySelectorAll('.card'), function (el) {
    el.addEventListener('click', function () { focar(el.getAttribute('data-id')); });
  });

  /* ---- marcadores ---- */
  var vistos = {};
  var bounds = [];
  ordem.forEach(function (id) {
    var v = frota[id];
    vistos[id] = true;
    var pos = [Number(v.d.lat), Number(v.d.lon)];
    bounds.push(pos);
    var m = marcadores[id];
    if (!m) {
      m = L.marker(pos, { icon: icone(id, v.online), zIndexOffset: v.online ? 1000 : 0 }).addTo(map);
      m.bindPopup('', { closeButton: true });
      marcadores[id] = m;
    } else {
      m.setLatLng(pos);
      m.setIcon(icone(id, v.online));
      m.setZIndexOffset(v.online ? 1000 : 0);
    }
    m.setPopupContent(pop(id, v));
  });
  Object.keys(marcadores).forEach(function (id) {
    if (!vistos[id]) { map.removeLayer(marcadores[id]); delete marcadores[id]; }
  });
  if (!ajustouPrimeiraVez && bounds.length) {
    map.fitBounds(L.latLngBounds(bounds).pad(0.25), { maxZoom: 16 });
    ajustouPrimeiraVez = true;
  }
}

function icone(id, online) {
  return L.divIcon({
    className: 'mk',
    html: '<div class="ponto ' + (online ? 'on' : 'off') + '"></div>' +
          '<div class="etiqueta">' + esc(id) + '</div>',
    iconSize: [0, 0],
    iconAnchor: [0, 0]
  });
}

function pop(id, v) {
  var quando = v.online ? 'agora' : (v.diffMin != null ? v.diffMin + ' min atrás' : '—');
  var bat = v.d.bateria == null ? '—' : v.d.bateria + '%';
  return '<div class="pop-nome">' + esc(id) +
    '<span class="pop-estado ' + (v.online ? 'on' : 'off') + '">● ' +
    (v.online ? 'ONLINE' : 'OFFLINE') + '</span></div>' +
    '<div class="pop-linha">🕒 atualizado: ' + quando + '</div>' +
    '<div class="pop-linha">🔋 bateria: ' + bat + '</div>' +
    '<div class="pop-linha">📶 ' + v.pts + ' registros (pts)</div>' +
    '<div class="pop-linha">📍 ' + Number(v.d.lat).toFixed(5) + ', ' +
    Number(v.d.lon).toFixed(5) + '</div>';
}

function focar(id) {
  var m = marcadores[id];
  if (!m) return;
  document.getElementById('painel').classList.add('fechado');
  document.getElementById('btnMenu').style.display = 'block';
  map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 16), { duration: 0.8 });
  m.openPopup();
}

/* ================= PAINEL ABRIR/FECHAR =============================== */
var painel = document.getElementById('painel');
var btnMenu = document.getElementById('btnMenu');
function alternarPainel() {
  var fechado = painel.classList.toggle('fechado');
  btnMenu.style.display = fechado ? 'block' : 'none';
}
btnMenu.addEventListener('click', alternarPainel);
document.getElementById('btnFechar').addEventListener('click', alternarPainel);
if (window.innerWidth < 640) alternarPainel();  // no celular começa fechado

/* ================= LOOP DE 15 s ====================================== */
buscar();
setInterval(buscar, CONFIG.ATUALIZA_MS);
</script>
</body>
</html>
