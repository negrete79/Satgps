<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carro GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="manifest" href="manifest.json?v=4">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000}
#map{height:100vh;width:100vw}
.glass{background:#00000055;color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffff18;border-radius:22px}
#selector{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:999;padding:4px;display:flex;gap:5px}
#selector button{padding:8px 14px;border-radius:12px;border:1px solid #ffffff15;background:#ffffff10;color:#fff;font-weight:700;font-size:11px;cursor:pointer}
#selector button.ativo{background:#ffffff;color:#000}
#menuBtn{position:absolute;top:12px;right:12px;z-index:1000;width:36px;height:36px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#menu{position:absolute;top:54px;right:12px;z-index:1000;padding:8px;display:none;flex-direction:column;gap:6px;min-width:160px}
#menu button{padding:10px 14px;border-radius:12px;border:1px solid #ffffff15;background:#ffffff10;color:#fff;font-size:12px;text-align:left;cursor:pointer}
#followBtn{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 24px;font-size:12px;font-weight:700;display:none;cursor:pointer}
#box{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 20px;text-align:center;font-family:system-ui;min-width:280px}
#box a{color:#fff;text-decoration:none;display:block;margin-top:6px;font-size:12px;font-weight:700}
#credito{margin-top:8px;font-size:10px;opacity:0.5}
.leaflet-control-layers{background:#00000060!important;color:#fff!important;backdrop-filter:blur(10px);border-radius:12px!important;border:1px solid #ffffff18!important}
</style>
</head>
<body>
<div id="map"></div>

<div id="selector" class="glass">
<button id="btn1" class="ativo" onclick="trocar('Palio1')">PALIO 1</button>
<button id="btn2" onclick="trocar('Palio2')">PALIO 2</button>
</div>

<div id="menuBtn" class="glass" onclick="toggleMenu()">⋮</div>
<div id="menu" class="glass">
<button id="mHist" onclick="toggleHist();toggleMenu()">👁️ HISTÓRICO: ON</button>
<button onclick="zerar();toggleMenu()" style="color:#ffb0b0;background:#ff000010">🗑️ ZERAR HISTÓRICO</button>
</div>

<button id="followBtn" class="glass" onclick="voltar()">📍 VOLTAR AO CARRO</button>

<div id="box" class="glass">
<div>🟢 <span id="nome">PALIO 1</span> - <span id="qtd">0</span> pontos</div>
<a id="gmap" href="#" target="_blank">IR PARA O GOOGLE MAPS</a>
<div id="credito">Crédito criado por Elias Costa NEGRET'S</div>
</div>

<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co";
const K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let ATUAL="Palio1", seguir=true, primeiro=true, verHist=true, menuAberto=false;
const ZOOM_FIXO = 17;

const sat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20});
const rua = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
const map = L.map('map',{layers:[sat], zoomControl:false}).setView([-20.3881,-43.7569],ZOOM_FIXO);
L.control.layers({"🛰️ SATÉLITE": sat, "🗺️ RUA": rua},{},{position:'topleft'}).addTo(map);

let m=L.marker([-20.3881,-43.7569]).addTo(map);
let poly=L.polyline([],{color:'red',weight:4}).addTo(map);

function toggleMenu(){menuAberto=!menuAberto;document.getElementById('menu').style.display=menuAberto?'flex':'none';}
function toggleHist(){verHist=!verHist;if(verHist){poly.addTo(map);document.getElementById('mHist').innerText='👁️ HISTÓRICO: ON';}else{map.removeLayer(poly);document.getElementById('mHist').innerText='🚫 HISTÓRICO: OFF';}}

map.on('dragstart',()=>{if(seguir){seguir=false;document.getElementById('followBtn').style.display='block';}});
map.on('click',()=>{if(menuAberto)toggleMenu();});

function voltar(){
  seguir=true;
  primeiro=true;
  document.getElementById('followBtn').style.display='none';
  // ANIMAÇÃO DESLIZANDO IGUAL UBER
  map.flyTo(m.getLatLng(), ZOOM_FIXO, { duration: 1.8, easeLinearity: 0.2 });
}

function trocar(c){
  ATUAL=c;
  document.getElementById('btn1').className=c=='Palio1'?'ativo':'';
  document.getElementById('btn2').className=c=='Palio2'?'ativo':'';
  document.getElementById('nome').innerText=c.toUpperCase();
  poly.setLatLngs([]);
  primeiro=true;
  seguir=true;
  document.getElementById('followBtn').style.display='none';
  up();
}

async function zerar(){
  if(!confirm(`Zerar histórico do ${ATUAL}?`)) return;
  let f=ATUAL=='Palio1'?`device_id=in.(Palio1,LG)`:`device_id=eq.${ATUAL}`;
  await fetch(`${U}/rest/v1/rastreador_historico?${f}`,{method:'DELETE',headers:{apikey:K,Authorization:"Bearer "+K}});
  poly.setLatLngs([]);
  document.getElementById('qtd').innerText='0';
}

async function up(){
 let ids=ATUAL=='Palio1'?`device_id=in.(Palio1,LG)`:`device_id=eq.${ATUAL}`;
 try{
  let r=await fetch(`${U}/rest/v1/rastreador?${ids}&order=updated_at.desc&limit=1`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:'no-store'});
  let d=await r.json(); if(!d[0]) return;
  m.setLatLng([d[0].lat,d[0].lng]);
  document.getElementById('gmap').href=`https://www.google.com/maps?q=${d[0].lat},${d[0].lng}`;
  let rh=await fetch(`${U}/rest/v1/rastreador_historico?${ids}&order=created_at.asc&limit=500`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:'no-store'});
  let h=await rh.json(); 
  if(h.length){
    poly.setLatLngs(h.map(x=>[x.lat,x.lng]));
    document.getElementById('qtd').innerText=h.length;
    if(primeiro){map.setView([d[0].lat,d[0].lng], ZOOM_FIXO); primeiro=false;}
    else if(seguir){map.panTo([d[0].lat,d[0].lng]);}
  }
 }catch(e){console.log(e)}
}
setTimeout(()=>map.invalidateSize(),500);
up();
setInterval(up,10000);

// Registra o SW novo
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=4');}
</script>
</body>
</html>
