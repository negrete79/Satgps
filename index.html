<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frota</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden}
#login{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:320px;background:#151515;border:1px solid #222;border-radius:24px;padding:28px;text-align:center}
.login-box input{width:100%;padding:14px;background:#000;border:1px solid #222;border-radius:12px;color:#fff;margin-top:10px}
.login-box button{width:100%;padding:14px;background:#a6ff00;color:#000;border:0;border-radius:12px;font-weight:900;margin-top:16px}

#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
.top{background:#111;padding:16px;border-bottom:1px solid #222}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;padding:12px;background:#000;border:1px solid #222;border-radius:12px;color:#fff}
.add button{padding:12px 18px;background:#a6ff00;border:0;border-radius:12px;font-weight:900;color:#000}
.list{flex:1;overflow-y:auto;padding:16px;background:#0a0a0a;display:flex;flex-direction:column;gap:10px}
.car{background:#151515;border:1px solid #222;border-radius:16px;padding:14px}

#modal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#modal.on{display:flex}
#map{width:100%;height:60vh;background:#111}
.mtop{position:absolute;top:10px;left:10px;right:10px;z-index:1000;display:flex;justify-content:space-between}
.gbtn{background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px 16px;border-radius:100px;font-weight:700;backdrop-filter:blur(20px)}
.gbtn.active{background:#fff;color:#000}

/* BARRA VIDRO CLARO - CORRIGIDO DO SEU PRINT */
#sheet{background:rgba(28,28,28,0.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,0.12);border-radius:28px 28px 0 0;margin-top:-28px;z-index:1001;padding:14px 20px 20px;min-height:200px;transition:0.35s cubic-bezier(0.32,0.72,0,1)}
#sheet.up{transform:translateY(-30vh)}
.handle{width:40px;height:5px;background:rgba(255,255,255,0.3);border-radius:10px;margin:0 auto 12px}
</style>
</head>
<body>

<div id="login">
<div class="login-box">
<h2>FROTA</h2>
<p style="color:#666;font-size:12px;margin:8px 0">login para entrar</p>
<input id="u" placeholder="usuario" value="admin">
<input id="p" type="password" placeholder="senha" value="1234">
<button onclick="entrar()">Entrar</button>
<p style="color:#444;font-size:10px;margin-top:10px">admin / 1234</p>
<p id="err" style="color:#ff4444;font-size:12px;display:none;margin-top:8px">senha errada</p>
</div>
</div>

<div id="app">
<div class="top">
<b>Minha Frota <span id="cnt" style="background:#a6ff00;color:#000;padding:2px 8px;border-radius:20px;font-size:11px">0</span></b>
<div class="add"><input id="novoId" placeholder="Ex: MOTO"><button onclick="addCar()">ADD</button></div>
</div>
<div class="list" id="lista"></div>
</div>

<div id="modal">
<div class="mtop">
<button class="gbtn" onclick="fechar()">← Voltar</button>
<div style="display:flex;gap:6px"><button id="bRua" class="gbtn active" onclick="troca('rua')">Rua</button><button id="bSat" class="gbtn" onclick="troca('sat')">Satélite</button></div>
</div>
<div id="map"></div>
<div id="sheet">
<div class="handle" onclick="sheet.classList.toggle('up')" style="cursor:pointer"></div>
<div id="sheetCont" style="color:#fff">Carregando...</div>
</div>
</div>

<script>
const URL_SUPA="https://jpaflbkafupwqfqfcjrv.supabase.co";
const KEY="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let carros=JSON.parse(localStorage.getItem('carros')||'["PALIO1","PALIO2","MOTO"]');
let map=null,rL,sL,sLb,ativo=null,marks={};

function entrar(){
  if(u.value==="admin" && p.value==="1234"){
    login.style.display="none";
    app.classList.add("on");
    localStorage.setItem("logado","1");
    carregar();
  }else{err.style.display="block"}
}
if(localStorage.getItem("logado")==="1"){login.style.display="none";app.classList.add("on")}

function initMap(){
  if(map){map.invalidateSize();return;}
  map=L.map('map',{zoomControl:false}).setView([-24.5,-48.8],10);
  rL=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  sL=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
  sLb=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
  L.control.zoom({position:'bottomright'}).addTo(map);
}
function troca(m){
  if(!map) return;
  if(m==="sat"){map.removeLayer(rL);sL.addTo(map);sLb.addTo(map);bSat.classList.add("active");bRua.classList.remove("active")}
  else{map.removeLayer(sL);map.removeLayer(sLb);rL.addTo(map);bRua.classList.add("active");bSat.classList.remove("active")}
  setTimeout(()=>map.invalidateSize(),100);
}
function abrir(id){
  ativo=id;
  modal.classList.add("on");
  setTimeout(()=>{
    initMap();
    const d=window._dados?.find(x=>x.device_id.toUpperCase()===id);
    if(d&&d.lat){
      const pos=[+d.lat,+d.lng];
      map.setView(pos,16);
      if(!marks[id]) marks[id]=L.marker(pos).addTo(map);
      else marks[id].setLatLng(pos);
    }
    map.invalidateSize();
  },200);
}
function fechar(){modal.classList.remove("on");sheet.classList.remove("up");ativo=null}

function addCar(){const id=novoId.value.trim().toUpperCase();if(!id)return;if(carros.includes(id))return alert("Ja existe");carros.push(id);localStorage.setItem("carros",JSON.stringify(carros));novoId.value="";carregar();}
function copiar(t){navigator.clipboard.writeText(t);alert("Copiado: "+t)}

async function carregar(){
  try{
    const res=await fetch(`${URL_SUPA}/rest/v1/rastreador?order=updated_at.desc`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});
    const dados=await res.json(); window._dados=dados;
    let html=""; let on=0;
    carros.forEach(id=>{
      const d=dados.find(x=>x.device_id.toUpperCase()===id);
      const online=d?Date.now()-new Date(d.updated_at).getTime()<120000:false;
      if(online) on++;
      const bat=d?.battery!=null?parseInt(d.battery):0;
      const link=`https://negrete79.github.io/Satgps/rastreador.html?id=${id}`;
      html+=`<div class="car" onclick="abrir('${id}')"><div style="display:flex;justify-content:space-between"><div><b>${id}</b> <span style="font-size:10px;background:${online?'#a6ff00':'#333'};color:${online?'#000':'#888'};padding:3px 8px;border-radius:20px">${online?'ONLINE':'OFFLINE'}</span><br><span style="font-size:11px;color:#666">${bat}% bateria</span></div><span>›</span></div><div style="font-size:10px;color:#555;background:#000;border:1px solid #1a1a1a;padding:6px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between"><span style="overflow:hidden;text-overflow:ellipsis">${link}</span><b style="color:#a6ff00;margin-left:8px" onclick="event.stopPropagation();copiar('${link}')">COPIAR</b></div></div>`;
      if(ativo===id && d){
        sheetCont.innerHTML=`
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div><b style="font-size:20px">${id}</b> <span style="font-size:11px;background:rgba(166,255,0,0.15);border:1px solid rgba(166,255,0,0.3);color:#a6ff00;padding:4px 8px;border-radius:20px">${online?'● ONLINE':'○ OFFLINE'}</span><br><span style="font-size:11px;color:#888">${new Date(d.updated_at).toLocaleString('pt-BR')}</span></div>
            <div style="text-align:right"><div style="font-size:30px;font-weight:900;color:${bat<20?'#ff4444':'#a6ff00'}">${bat}%</div><div style="font-size:9px;color:#666">BATERIA</div></div>
          </div>
          <div style="height:4px;background:#222;border-radius:10px;margin:12px 0"><div style="height:100%;width:${bat}%;background:#a6ff00"></div></div>
          <div style="display:flex;gap:8px">
            <button class="gbtn" style="flex:1;background:rgba(255,255,255,0.08)" onclick="fechar()">← Voltar</button>
            <button class="gbtn" style="flex:1;background:rgba(255,255,255,0.08)" onclick="map.setView([${d.lat},${d.lng}],17)">🎯 Explorar</button>
            <button class="gbtn" style="flex:1;background:#a6ff00;color:#000" onclick="window.open('https://maps.google.com/?q=${d.lat},${d.lng}','_blank')">📍 Google</button>
          </div>
          <p style="font-size:10px;color:#555;text-align:center;margin-top:10px">↕️ Toque na barrinha pra expandir / recolher</p>
        `;
      }
    });
    lista.innerHTML=html||"<p style='color:#555;text-align:center'>Nenhum carro</p>";
    cnt.innerText=carros.length;
  }catch(e){lista.innerHTML="Erro: "+e.message}
}
setInterval(carregar,6000);
if(localStorage.getItem("logado")==="1") carregar();
</script>
</body>
</html>
