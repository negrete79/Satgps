<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rastreador PALIO2</title>
<style>body{font-family:system-ui;background:#111;color:#fff;padding:20px;text-align:center}.card{background:#222;border-radius:16px;padding:20px;max-width:400px;margin:0 auto}button{width:100%;padding:16px;border-radius:12px;border:0;font-weight:900;font-size:18px;margin:8px 0;cursor:pointer}#btnOn{background:#00ff88}#btnOff{background:#ff4444;color:#fff}.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;margin:4px}.ok{background:#00ff88;color:#000}.err{background:#ff4444;color:#fff}.warn{background:#ffaa00;color:#000}.log{background:#000;color:#0f0;text-align:left;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;height:120px;overflow:auto;margin-top:10px}</style>
</head>
<body>
<div class="card">
<h2>📍 PALIO2 - Rastreador</h2>
<div id="status" class="badge warn">parado</div>
<div id="conn" class="badge err">sem conexão</div>
<p>GPS: <span id="gps">--</span></p>
<p>Precisão: <span id="acc">--</span></p>
<p>Último envio: <span id="last">--</span></p>
<button id="btnOn" onclick="iniciar()">▶ INICIAR RASTREIO</button>
<button id="btnOff" onclick="parar()">■ PARAR</button>
<div id="log" class="log">Aguardando...
</div>
</div>
<script>
var CONFIG = {
  SUPABASE_URL: 'https://jpaflbkafupwqfqfcjrv.supabase.co',
  SUPABASE_KEY: 'sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf',
  DEVICE_ID: 'PALIO2'
};
var watchId=null; var intervalId=null; var lastPos=null;
function addLog(m){var el=document.getElementById('log');var t=new Date().toLocaleTimeString('pt-BR');el.innerHTML=t+' - '+m+'\n'+el.innerHTML;}
function updateUI(status, conn){document.getElementById('status').textContent=status;document.getElementById('conn').textContent=conn;document.getElementById('conn').className='badge '+(conn.includes('online')?'ok':'err');}
async function enviar(pos){lastPos=pos;document.getElementById('gps').textContent=pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6);document.getElementById('acc').textContent='±'+Math.round(pos.coords.accuracy)+'m';var body={device_id:CONFIG.DEVICE_ID,lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,speed:pos.coords.speed||0,created_at:new Date().toISOString()};try{var r=await fetch(CONFIG.SUPABASE_URL+'/rest/v1/posicoes',{method:'POST',headers:{'Content-Type':'application/json','apikey':CONFIG.SUPABASE_KEY,'Authorization':'Bearer '+CONFIG.SUPABASE_KEY,'Prefer':'return=minimal'},body:JSON.stringify(body)});if(r.ok){document.getElementById('last').textContent=new Date().toLocaleTimeString('pt-BR');updateUI('rastreando','online ✓');addLog('Enviado '+body.lat.toFixed(5));}else{var txt=await r.text();addLog('ERRO HTTP '+r.status+' '+txt.substring(0,120));updateUI('erro','sem conexão '+r.status);}}catch(e){addLog('Failed to fetch '+e.message);updateUI('erro','sem conexão - fetch falhou');}}
function iniciar(){if(!navigator.geolocation){alert('Sem GPS');return;}addLog('Iniciando GPS...');updateUI('iniciando','conectando...');watchId=navigator.geolocation.watchPosition(function(p){lastPos=p;enviar(p);},function(e){addLog('GPS ERRO '+e.message);},{enableHighAccuracy:true,maximumAge:0,timeout:10000});intervalId=setInterval(function(){if(lastPos) enviar(lastPos);},5000);document.getElementById('btnOn').style.opacity='0.5';}
function parar(){if(watchId) navigator.geolocation.clearWatch(watchId);if(intervalId) clearInterval(intervalId);updateUI('parado','sem conexão');addLog('Parado');document.getElementById('btnOn').style.opacity='1';}
</script>
</body>
</html>
