<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Teste</title>
<style>body{font-family:sans-serif;padding:20px} button{padding:15px 25px;font-size:18px} #log{margin-top:20px;white-space:pre-wrap;background:#eee;padding:10px}</style>
</head>
<body>
<h2>Teste de Envio GPS</h2>
<button onclick="iniciar()">📍 ATIVAR E PERMITIR LOCALIZAÇÃO</button>
<div id="log">Aguardando clique...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const URL="https://zrghmwdzxslpuyglsvnq.supabase.co";
const KEY="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const sb=supabase.createClient(URL,KEY);
const logEl = document.getElementById('log');

function log(t){ logEl.textContent = new Date().toLocaleTimeString() + " - " + t + "\n" + logEl.textContent; }

async function iniciar(){
  log("Pedindo permissão...");
  navigator.geolocation.watchPosition(async p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude;
    log(`Posição: ${lat}, ${lng} - Enviando...`);
    const {error}=await sb.from('rastreador').upsert({device_id:'LG',lat,lng,updated_at:new Date().toISOString()},{onConflict:'device_id'});
    if(error) log("ERRO Supabase: "+error.message); else log("ENVIADO com sucesso!");
  }, e=>{
    log("ERRO GPS: "+e.message+" - Ative o GPS do celular e dê permissão de Localização nas configurações do Chrome");
  }, {enableHighAccuracy:true});
}
</script>
</body>
</html>
