<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Frota Palio GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%}#map{height:100vh;width:100vw;background:#000}
.glass{background:#00000018;color:#fff;backdrop-filter:blur(12px);border:1px solid #ffffff12;border-radius:22px}
#box{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 20px;text-align:center;font-family:system-ui;min-width:280px;opacity:0.8}
#box a{color:#fff;text-decoration:none;display:block;margin-top:6px;font-size:12px}
#credito{margin-top:8px;font-size:10px;opacity:0.5}
#selector{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:999;padding:4px;display:flex;gap:5px;opacity:0.7}
#selector button{padding:8px 14px;border-radius:12px;border:1px solid #ffffff10;background:#ffffff08;color:#fff;font-weight:700;font-size:11px}
#selector button.ativo{background:#ffffffcc;color:#000}
#menuBtn{position:absolute;top:12px;right:12px;z-index:1000;width:36px;height:36px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;opacity:0.4;cursor:pointer}
#menu{position:absolute;top:54px;right:12px;z-index:1000;padding:8px;display:none;flex-direction:column;gap:6px;min-width:150px;opacity:0.9}
#menu button{padding:10px 14px;border-radius:12px;border:1px solid #ffffff10;background:#ffffff08;color:#fff;font-size:12px;text-align:left}
#menu button.zerar{color:#ffb0b0;background:#ff000010}
#followBtn{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 22px;font-size:12px;display:none;opacity:0.85}
#followBtn.mostrar{display:block;animation:pop 0.3s ease}
@keyframes pop{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}
.leaflet-control-layers{background:#00000040!important;color:#fff!important;backdrop-filter:blur(12px);border:1px solid #ffffff12!important;border-radius:12px!important;opacity:0.6}
</style>
</head><body>
<div id="map"></div>
<div id="selector" class="glass">
<button id="btn1" class="ativo" onclick="trocar('Palio1')">PALIO 1</button>
<button id="btn2" onclick="trocar('Palio2')">PALIO 2</button>
</div>

<div id="menuBtn" class="glass" onclick="toggleMenu()">⋮</div>
<div id="menu" class="glass">
<button id="mHist" onclick="toggleHist();toggleMenu()">👁️ HISTÓRICO: ON</button>
<button class="zerar" onclick="zerar();toggleMenu()">🗑️ ZERAR HISTÓRICO</button>
</div>

<button id="followBtn" class="glass" onclick="voltar()">📍 VOLTAR AO CARRO</button>

<div id="box" class="glass">
<div>🟢 <span id="nome">PALIO 1</span> - <span id="qtd">0</span> pontos</div>
<a id="gmap" href="#" target="_blank"><b>IR PARA O GOOGLE MAPS</b></a>
<div id="credito">Crédito criado por Elias Costa NEGRET'S</div>
</div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
let ATUAL="Palio1", seguir=true, primeiro=true, verHist=true, menuAberto=false;
const ZOOM_FIXO = 17;
const sat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20});
const rua = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
const map = L.map('map',{layers:[sat]}).setView([-20.3881,-43.7569],ZOOM_FIXO);
L.control.layers({"🛰️ SATÉLITE": sat, "🗺️ RUA": rua},{},{position:'topleft'}).addTo(map);
let m=L.marker([-20.3881,-43.7569]).addTo(map);
let poly=L.polyline([],{color:'red',weight:4}).addTo(map);

function toggleMenu(){ menuAberto=!menuAberto; document.getElementById('menu').style.display=menuAberto?'flex':'none'; }
function toggleHist(){ verHist=!verHist; if(verHist){ poly.addTo(map); document.getElementById('mHist').innerText='👁️ HISTÓRICO: ON'; } else { map.removeLayer(poly); document.getElementById('mHist').innerText='🚫 HISTÓRICO: OFF'; } }

function parar(){ if(seguir){ seguir=false; document.getElementById('followBtn').classList.add('mostrar'); } }
map.on('dragstart', parar); map.on('zoomstart', parar);
map.on('click', ()=>{ if(menuAberto) toggleMenu(); });

function voltar(){ 
  seguir=true; 
  primeiro=true; 
  document.getElementById('followBtn').classList.remove('mostrar');
  map.flyTo(m.getLatLng(), ZOOM_FIXO, { duration: 1.8, easeLinearity: 0.2 });
}

function trocar(c){ATUAL=c;document.getElementById('btn1').className=c=='Palio1'?'ativo':'';document.getElementById('btn2').className=c=='Palio2'?'ativo':'';document.getElementById('nome').innerText=c.toUpperCase();poly.setLatLngs([]);primeiro=true;seguir=true;document.getElementById('followBtn').classList.remove('mostrar');up()}
async function zerar(){ if(!confirm(`Zerar ${ATUAL}?`)) return; let f=ATUAL=='Palio1'?`device_id=in.(Palio1,LG)`:`device_id=eq.${ATUAL}`; await fetch(`${U}/rest/v1/rastreador_historico?${f}`,{method:'DELETE',headers:{apikey:K,Authorization:"Bearer "+K}}); poly.setLatLngs([]); document.getElementById('qtd').innerText='0'; }
async function up(){
 let ids=ATUAL=='Palio1'?`device_id=in.(Palio1,LG)`:`device_id=eq.${ATUAL}`;
 let r=await fetch(`${U}/rest/v1/rastreador?${ids}&order=updated_at.desc&limit=1`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:'no-store'});
 let d=await r.json(); if(!d[0]) return;
 m.setLatLng([d[0].lat,d[0].lng]);
 document.getElementById('gmap').href=`https://www.google.com/maps?q=${d[0].lat},${d[0].lng}`;
 let rh=await fetch(`${U}/rest/v1/rastreador_historico?${ids}&order=created_at.asc&limit=500`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:'no-store'});
 let h=await rh.json(); 
 if(h.length){poly.setLatLngs(h.map(x=>[x.lat,x.lng]));document.getElementById('qtd').innerText=h.length; if(primeiro){map.setView([d[0].lat,d[0].lng], ZOOM_FIXO); primeiro=false;} else if(seguir){map.panTo([d[0].lat,d[0].lng]);}}
}
setTimeout(()=>map.invalidateSize(),600);
up(); setInterval(up,10000);
</script></body></html>
