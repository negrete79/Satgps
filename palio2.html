<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000"><title>Palio 2 GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}#map{height:100vh;width:100vw}
.glass{background:#00000040;color:#fff;backdrop-filter:blur(12px);border:1px solid #ffffff26;border-radius:22px}
#box{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 20px;text-align:center;font-family:system-ui;min-width:260px}
#box a{color:#fff;text-decoration:none;display:block;margin-top:6px;font-size:12px}
#box a b{text-decoration:underline}
#credito{margin-top:8px;font-size:10px;opacity:0.45;text-transform:uppercase}
#followBtn{position:absolute;top:85px;left:12px;z-index:999;padding:10px 16px;display:none}
</style>
</head><body>
<div id="map"></div>
<button id="followBtn" class="glass">📍 VOLTAR</button>
<div id="box" class="glass">
<div id="st">🟢 PALIO 2 ONLINE</div>
<a id="gmap" href="#" target="_blank"><b>IR PARA O GOOGLE MAPS</b></a>
<div id="credito">Crédito criado por Elias Costa NEGRET'S</div>
</div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const map=L.map('map').setView([-20.3881,-43.7569],18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let m=L.marker([-20.3881,-43.7569]).addTo(map);
async function up(){
 const r=await fetch(`${U}/rest/v1/rastreador?device_id=eq.Palio2&order=updated_at.desc&limit=1`,{headers:{apikey:K,Authorization:"Bearer "+K}});
 const d=await r.json(); if(d[0]){ m.setLatLng([d[0].lat,d[0].lng]); map.panTo([d[0].lat,d[0].lng]); document.getElementById('gmap').href=`https://www.google.com/maps?q=${d[0].lat},${d[0].lng}`; }
}
up(); setInterval(up,5000);
</script></body></html>
