<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador Palio 1 - STEALTH</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui}
#normal{padding:20px;text-align:center}
#stealth{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;display:none}
button{padding:15px 30px;font-size:16px;border-radius:12px;border:none;font-weight:800;margin:10px}
#btnStart{background:#fff;color:#000}
#btnStealth{background:#111;color:#555;border:1px solid #222}
#info{margin-top:20px;font-size:12px;opacity:0.6}
</style>
</head>
<body>
<div id="normal">
<h2>PALIO 1 - Rastreador</h2>
<button id="btnStart" onclick="iniciar()">▶️ INICIAR RASTREAMENTO</button><br>
<button id="btnStealth" onclick="ativarStealth()">🌑 MODO ESCURO TOTAL</button>
<div id="status">Parado</div>
<div id="info"></div>
<div style="margin-top:20px;font-size:11px;opacity:0.4">Bateria: <span id="bat">--</span> | Pontos: <span id="pts">0</span></div>
</div>
<div id="stealth" onclick="desativarStealth()"></div>
<script>
const U="https://jpaflbkafupwqfqfcjrv.supabase.co", K="sb_publishable_qek2mggF5M47pKggbM42tQ_WTFnOOxf";
const DEVICE="Palio1";
let watchId=null, intervalo=null, pontos=0, wakeLock=null;
async function getBatteryReal(){ try{ if(navigator.getBattery){ let b=await navigator.getBattery(); return Math.round(b.level*100); } }catch(e){} return null; }
async function enviar(lat,lng){
 let bat=await getBatteryReal();
 let payload={device_id:DEVICE,lat:lat,lng:lng,updated_at:new Date().toISOString(),battery:bat};
 try{ await fetch(`${U}/rest/v1/rastreador?device_id=eq.${DEVICE}`,{method:'PATCH',headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify(payload)}); }catch(e){}
 try{ await fetch(`${U}/rest/v1/rastreador_historico`,{method:'POST',headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({device_id:DEVICE,lat:lat,lng:lng,battery:bat})}); }catch(e){}
 document.getElementById('pts').innerText=++pontos; if(bat!==null) document.getElementById('bat').innerText=bat+'%';
}
function iniciar(){
 if(watchId!==null) return;
 document.getElementById('status').innerText='🟢 Rastreando...';
 if('wakeLock' in navigator){ navigator.wakeLock.request('screen').then(l=>{wakeLock=l;}).catch(()=>{}); }
 watchId=navigator.geolocation.watchPosition(pos=>{ enviar(pos.coords.latitude,pos.coords.longitude); document.getElementById('info').innerText=pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6); },err=>{document.getElementById('status').innerText='Erro GPS: '+err.message;},{enableHighAccuracy:true,maximumAge:0,timeout:10000});
 intervalo=setInterval(()=>{ navigator.geolocation.getCurrentPosition(p=>enviar(p.coords.latitude,p.coords.longitude)); },30000);
}
function ativarStealth(){ if(watchId===null){iniciar();} document.getElementById('stealth').style.display='block'; document.getElementById('normal').style.display='none'; }
function desativarStealth(){ document.getElementById('stealth').style.display='none'; document.getElementById('normal').style.display='block'; }
</script>
</body>
</html>
